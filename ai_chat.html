
<!-- شات الذكاء الاصطناعي - النسخة المطوّرة -->
<section class="section fade-in" id="ai">
  <h2>🤖 ذكاء اصطناعي</h2>
  <p style="text-align:center; color:#aaa; margin-bottom:25px;">
    اسأل أي شي — رد سريع + ذكاء قوي
  </p>

  <div class="card" style="padding:0; overflow:hidden; border-color:#00ff88; box-shadow:0 0 40px rgba(0,255,136,0.2);">
    
    <!-- الرأس -->
    <div style="padding:15px 20px; background:linear-gradient(135deg, #00ff88, #00cc66); display:flex; align-items:center; gap:10px;">
      <div style="width:40px; height:40px; background:#000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:0 0 15px rgba(0,0,0,0.5);">🤖</div>
      <div style="flex:1;">
        <div style="color:#000; font-weight:bold; font-size:16px;">Karrar AI</div>
        <div style="color:#000; font-size:12px; opacity:0.75; display:flex; align-items:center; gap:5px;">
          <span style="width:8px; height:8px; background:#00ff00; border-radius:50%; animation:blink 1.5s infinite; display:inline-block;"></span>
          متصل • رد سريع
        </div>
      </div>
      <button onclick="clearChat()" title="محو المحادثة" style="width:36px; height:36px; background:rgba(0,0,0,0.2); border:none; border-radius:50%; color:#000; font-size:16px; cursor:pointer; transition:0.3s;">🔄</button>
    </div>

    <!-- الرسائل -->
    <div id="chatMessages" style="height:420px; overflow-y:auto; padding:20px; background:linear-gradient(180deg, #0a0a0a, #050505); display:flex; flex-direction:column; gap:12px;">
      
      <div style="display:flex; gap:10px; align-items:flex-start;">
        <div style="width:35px; height:35px; background:#00ff88; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; box-shadow:0 0 15px rgba(0,255,136,0.5);">🤖</div>
        <div style="background:#1a1a1a; padding:12px 16px; border-radius:15px; border-top-right-radius:5px; max-width:80%; color:#fff; font-size:14px; line-height:1.7; border:1px solid rgba(0,255,136,0.2);">
          أهلاً! أنا <b style="color:#00ff88">Karrar AI</b> 🤖<br>اسألني أي شي بالعربي — راح أجاوبك بسرعة وبقوة.
        </div>
      </div>

    </div>

    <!-- الإدخال -->
    <div style="padding:15px; background:#111; border-top:1px solid rgba(0,255,136,0.4); display:flex; gap:10px; align-items:center;">
      <input 
        type="text" 
        id="chatInput" 
        placeholder="اكتب سؤالك هنا..." 
        onkeypress="if(event.key==='Enter' && !event.shiftKey) sendMessage()"
        autocomplete="off"
        style="flex:1; padding:14px 20px; background:#1a1a1a; color:#fff; border:2px solid rgba(0,255,136,0.3); border-radius:28px; font-size:15px; outline:none; transition:0.3s; font-family:inherit;"
        onfocus="this.style.borderColor='#00ff88'; this.style.boxShadow='0 0 20px rgba(0,255,136,0.3)'"
        onblur="this.style.borderColor='rgba(0,255,136,0.3)'; this.style.boxShadow='none'"
      >
      <button 
        onclick="sendMessage()" 
        id="sendBtn"
        onmouseover="this.style.transform='scale(1.1) rotate(15deg)'"
        onmouseout="this.style.transform='scale(1) rotate(0deg)'"
        style="
          width:52px; 
          height:52px; 
          background:linear-gradient(135deg, #00ff88, #00cc66); 
          color:#000; 
          border:none; 
          border-radius:50%; 
          cursor:pointer; 
          display:flex; 
          align-items:center; 
          justify-content:center;
          box-shadow:0 0 20px rgba(0,255,136,0.5);
          transition:0.3s;
          flex-shrink:0;
        "
        title="إرسال"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="#000"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- أزرار سريعة -->
  <div style="text-align:center; margin-top:20px;">
    <p style="color:#aaa; font-size:13px; margin-bottom:10px;">💡 جرب أسئلة سريعة:</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
      <button onclick="quickAsk('اكتب لي قصة قصيرة')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">📖 قصة قصيرة</button>
      <button onclick="quickAsk('اعطني نصيحة اليوم')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">💡 نصيحة</button>
      <button onclick="quickAsk('اكتب لي بيت شعر')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">🎭 بيت شعر</button>
      <button onclick="quickAsk('اشرح لي الذكاء الاصطناعي ببساطة')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">🤖 AI</button>
    </div>
  </div>

  <p style="text-align:center; color:#666; font-size:11px; margin-top:15px;">
    ⚠️ الإجابات من AI — قد تحتوي أخطاء
  </p>

</section>

<script>
// ═══ Karrar AI Chat - المطوّر ═══

// الـ API السريع
const AI_API = 'https://text.pollinations.ai/';

// System Prompt — يخلي AI يفكر بقوة
const SYSTEM_PROMPT = encodeURIComponent(
  'أنت مساعد ذكي اسمه Karrar AI. تجاوب بالعربي الفصيح المبسط. ردودك سريعة ودقيقة ومفيدة. إذا السؤال يحتاج شرح، اشرح بوضوح. إذا طلب قصة، اكتب قصة جميلة. إذا طلب نصيحة، أعطِ نصيحة حكيمة. كن مفيداً ومحترماً.'
);

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message) return;

  // عرض رسالة المستخدم
  addMessage(message, 'user');
  input.value = '';
  input.focus();

  // إظهار نقاط التحميل
  const loadingId = addLoading();

  try {
    // بناء الرابط — model سريع
    const url = AI_API + encodeURIComponent(message) + 
                '?model=openai&system=' + SYSTEM_PROMPT;

    const response = await fetch(url);
    const reply = await response.text();

    // إزالة التحميل
    removeLoading(loadingId);

    // عرض الرد بتأثير الكتابة
    typeMessage(reply.trim());

  } catch (err) {
    removeLoading(loadingId);
    addMessage('❌ صار خطأ — تحقق من الإنترنت وجرب مرة ثانية', 'ai');
  }
}

function addMessage(text, type) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.style.display = 'flex';
  div.style.gap = '10px';
  div.style.alignItems = 'flex-start';
  div.style.animation = 'slideIn 0.3s ease';

  if (type === 'user') {
    div.style.flexDirection = 'row-reverse';
    div.innerHTML = `
      <div style="width:35px; height:35px; background:linear-gradient(135deg, #00ccff, #0099cc); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; box-shadow:0 0 15px rgba(0,204,255,0.4);">👤</div>
      <div style="background:linear-gradient(135deg, #003d2b, #002a1e); padding:12px 16px; border-radius:15px; border-top-left-radius:5px; max-width:80%; color:#fff; font-size:14px; line-height:1.6; word-wrap:break-word; border:1px solid rgba(0,204,255,0.3);">${escapeHtml(text)}</div>
    `;
  } else {
    div.innerHTML = `
      <div style="width:35px; height:35px; background:#00ff88; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; box-shadow:0 0 15px rgba(0,255,136,0.5);">🤖</div>
      <div style="background:#1a1a1a; padding:12px 16px; border-radius:15px; border-top-right-radius:5px; max-width:80%; color:#fff; font-size:14px; line-height:1.7; word-wrap:break-word; border:1px solid rgba(0,255,136,0.2);">${escapeHtml(text).replace(/\n/g, '<br>')}</div>
    `;
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// تأثير الكتابة حرف حرف
function typeMessage(text) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.style.display = 'flex';
  div.style.gap = '10px';
  div.style.alignItems = 'flex-start';
  div.style.animation = 'slideIn 0.3s ease';

  const bubble = document.createElement('div');
  bubble.style.cssText = 'background:#1a1a1a; padding:12px 16px; border-radius:15px; border-top-right-radius:5px; max-width:80%; color:#fff; font-size:14px; line-height:1.7; word-wrap:break-word; border:1px solid rgba(0,255,136,0.2);';

  div.innerHTML = `
    <div style="width:35px; height:35px; background:#00ff88; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; box-shadow:0 0 15px rgba(0,255,136,0.5);">🤖</div>
  `;
  div.appendChild(bubble);
  container.appendChild(div);

  // اكتب حرف حرف
  let i = 0;
  const speed = 15; // ms per char
  const interval = setInterval(() => {
    if (i < text.length) {
      bubble.innerHTML = escapeHtml(text.substring(0, i + 1)).replace(/\n/g, '<br>');
      i++;
      container.scrollTop = container.scrollHeight;
    } else {
      clearInterval(interval);
    }
  }, speed);
}

function addLoading() {
  const container = document.getElementById('chatMessages');
  const id = 'loading_' + Date.now();
  const div = document.createElement('div');
  div.id = id;
  div.style.display = 'flex';
  div.style.gap = '10px';
  div.style.alignItems = 'flex-start';
  div.style.animation = 'slideIn 0.3s ease';
  div.innerHTML = `
    <div style="width:35px; height:35px; background:#00ff88; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; box-shadow:0 0 15px rgba(0,255,136,0.5);">🤖</div>
    <div style="background:#1a1a1a; padding:14px 18px; border-radius:15px; display:flex; gap:5px; align-items:center; border:1px solid rgba(0,255,136,0.2);">
      <span style="width:8px; height:8px; background:#00ff88; border-radius:50%; animation:typing 1.4s infinite;"></span>
      <span style="width:8px; height:8px; background:#00ff88; border-radius:50%; animation:typing 1.4s infinite 0.2s;"></span>
      <span style="width:8px; height:8px; background:#00ff88; border-radius:50%; animation:typing 1.4s infinite 0.4s;"></span>
    </div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return id;
}

function removeLoading(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function quickAsk(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

function clearChat() {
  if (!confirm('هل تريد محو المحادثة؟')) return;
  const container = document.getElementById('chatMessages');
  container.innerHTML = `
    <div style="display:flex; gap:10px; align-items:flex-start;">
      <div style="width:35px; height:35px; background:#00ff88; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;">🤖</div>
      <div style="background:#1a1a1a; padding:12px 16px; border-radius:15px; border-top-right-radius:5px; max-width:80%; color:#fff; font-size:14px; line-height:1.7; border:1px solid rgba(0,255,136,0.2);">
        تم محو المحادثة ✅<br>اسألني أي شي جديد.
      </div>
    </div>
  `;
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>

<style>
@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
  30% { transform: translateY(-5px); opacity: 1; }
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
