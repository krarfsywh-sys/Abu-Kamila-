
<!-- مولّد صور AI -->
<section class="section fade-in" id="ai-image">
  <h2>🎨 AI يرسم صور</h2>
  <p style="text-align:center; color:#aaa; margin-bottom:25px;">
    اكتب وصف — والذكاء الاصطناعي يرسمها لك
  </p>

  <div class="card" style="padding:25px; border-color:#00ff88;">
    
    <!-- الحقل -->
    <label style="color:#00ff88; font-size:14px; display:block; margin-bottom:10px;">✍️ اكتب وصف الصورة:</label>
    <textarea 
      id="imgPrompt" 
      placeholder="مثال: قطة تلعب مع ديناصور في الفضاء"
      rows="3"
      style="width:100%; padding:15px; background:#111; color:#fff; border:2px solid rgba(0,255,136,0.3); border-radius:12px; font-size:15px; font-family:inherit; resize:vertical; outline:none;"
      onfocus="this.style.borderColor='#00ff88'"
      onblur="this.style.borderColor='rgba(0,255,136,0.3)'"
    ></textarea>

    <!-- خيارات النمط -->
    <div style="margin-top:15px;">
      <label style="color:#00ff88; font-size:13px; display:block; margin-bottom:8px;">🎨 اختر النمط:</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button onclick="setStyle('realistic')" class="style-btn active" data-style="realistic">📷 واقعي</button>
        <button onclick="setStyle('anime')" class="style-btn" data-style="anime">🎌 أنمي</button>
        <button onclick="setStyle('cartoon')" class="style-btn" data-style="cartoon">🎨 كرتون</button>
        <button onclick="setStyle('3d')" class="style-btn" data-style="3d">🎭 ثلاثي</button>
        <button onclick="setStyle('art')" class="style-btn" data-style="art">🖼️ فني</button>
      </div>
    </div>

    <!-- الحجم -->
    <div style="margin-top:15px;">
      <label style="color:#00ff88; font-size:13px; display:block; margin-bottom:8px;">📐 الحجم:</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button onclick="setSize('square')" class="size-btn active" data-size="square">⬛ مربع</button>
        <button onclick="setSize('portrait')" class="size-btn" data-size="portrait">📱 طولي</button>
        <button onclick="setSize('landscape')" class="size-btn" data-size="landscape">🖥️ عرضي</button>
      </div>
    </div>

    <!-- زر الرسم -->
    <button 
      onclick="generateImage()" 
      id="genBtn"
      style="width:100%; margin-top:20px; padding:18px; background:linear-gradient(135deg, #00ff88, #00cc66); color:#000; border:none; border-radius:12px; font-size:18px; font-weight:bold; cursor:pointer; box-shadow:0 0 25px rgba(0,255,136,0.5); transition:0.3s;"
      onmouseover="this.style.transform='scale(1.02)'"
      onmouseout="this.style.transform='scale(1)'"
    >
      🎨 ارسم الصورة
    </button>

    <!-- النتيجة -->
    <div id="imgResult" style="margin-top:20px; display:none;">
      <div id="imgLoading" style="text-align:center; padding:30px;">
        <div style="font-size:50px; animation:pulse 1.5s infinite;">🎨</div>
        <p style="color:#00ff88; margin-top:15px;">جاري الرسم... (10-20 ثانية)</p>
      </div>
      <div id="imgDisplay" style="display:none;">
        <img id="resultImg" style="width:100%; border-radius:15px; border:2px solid #00ff88; box-shadow:0 0 30px rgba(0,255,136,0.4);" alt="AI Image">
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button onclick="downloadImg()" class="btn" style="flex:1; background:#00ff88; color:#000; padding:12px; border-radius:10px; border:none; font-weight:bold; cursor:pointer;">💾 تحميل</button>
          <button onclick="generateImage()" class="btn btn-outline" style="flex:1; padding:12px;">🔄 رسم جديد</button>
        </div>
      </div>
      <div id="imgError" style="display:none; text-align:center; padding:20px; color:#ff0044;">
        ❌ صار خطأ — جرب مرة ثانية
      </div>
    </div>

  </div>

  <!-- اقتراحات -->
  <div style="text-align:center; margin-top:20px;">
    <p style="color:#aaa; font-size:13px; margin-bottom:10px;">💡 جرب:</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
      <button onclick="setPrompt('قط في الفضاء')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">🐱 قط في الفضاء</button>
      <button onclick="setPrompt('غروب الشمس في البصرة')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">🌅 غروب البصرة</button>
      <button onclick="setPrompt('مدينة عربية قديمة')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">🏛️ مدينة عربية</button>
      <button onclick="setPrompt('شعار ناري باسم KARRAR')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">🔥 شعار ناري</button>
    </div>
  </div>

</section>

<style>
.style-btn, .size-btn {
  padding: 10px 18px;
  background: rgba(0,255,136,0.05);
  color: #00ff88;
  border: 1px solid rgba(0,255,136,0.3);
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: 0.3s;
  font-family: inherit;
}
.style-btn:hover, .size-btn:hover {
  background: rgba(0,255,136,0.15);
}
.style-btn.active, .size-btn.active {
  background: #00ff88;
  color: #000;
  font-weight: bold;
  box-shadow: 0 0 15px rgba(0,255,136,0.5);
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
</style>

<script>
// ═══ AI Image Generator ═══
let currentStyle = 'realistic';
let currentSize = 'square';

const STYLES = {
  realistic: 'photorealistic, high quality, detailed, 4k, sharp focus',
  anime: 'anime style, japanese animation, studio ghibli, colorful',
  cartoon: 'cartoon style, cute, colorful, disney pixar, vibrant',
  '3d': '3d render, octane render, cinematic, dramatic lighting',
  art: 'digital art, concept art, artistic, masterpiece, trending'
};

const SIZES = {
  square: '1024x1024',
  portrait: '768x1344',
  landscape: '1344x768'
};

function setStyle(style) {
  currentStyle = style;
  document.querySelectorAll('.style-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.style === style);
  });
}

function setSize(size) {
  currentSize = size;
  document.querySelectorAll('.size-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.size === size);
  });
}

function setPrompt(text) {
  document.getElementById('imgPrompt').value = text;
  generateImage();
}

async function generateImage() {
  const prompt = document.getElementById('imgPrompt').value.trim();
  if (!prompt) {
    alert('اكتب وصف الصورة أول');
    return;
  }

  // إظهار التحميل
  document.getElementById('imgResult').style.display = 'block';
  document.getElementById('imgLoading').style.display = 'block';
  document.getElementById('imgDisplay').style.display = 'none';
  document.getElementById('imgError').style.display = 'none';
  document.getElementById('genBtn').disabled = true;
  document.getElementById('genBtn').textContent = '⏳ جاري الرسم...';

  // بناء الرابط
  const fullPrompt = `${prompt}, ${STYLES[currentStyle]}`;
  const [w, h] = SIZES[currentSize].split('x');
  const seed = Math.floor(Math.random() * 999999999);
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=${w}&height=${h}&seed=${seed}&nologo=true`;

  // تحميل الصورة
  const img = document.getElementById('resultImg');
  const timeout = setTimeout(() => {
    showError();
  }, 60000);

  img.onload = () => {
    clearTimeout(timeout);
    document.getElementById('imgLoading').style.display = 'none';
    document.getElementById('imgDisplay').style.display = 'block';
    document.getElementById('genBtn').disabled = false;
    document.getElementById('genBtn').textContent = '🎨 ارسم الصورة';
  };

  img.onerror = () => {
    clearTimeout(timeout);
    showError();
  };

  img.src = url + '&t=' + Date.now(); // تجنب الكاش
}

function showError() {
  document.getElementById('imgLoading').style.display = 'none';
  document.getElementById('imgError').style.display = 'block';
  document.getElementById('genBtn').disabled = false;
  document.getElementById('genBtn').textContent = '🎨 ارسم الصورة';
}

function downloadImg() {
  const img = document.getElementById('resultImg');
  if (!img.src) return;
  const a = document.createElement('a');
  a.href = img.src;
  a.download = 'AI_Image_' + Date.now() + '.jpg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>
