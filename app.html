<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a66ff">
<title>حاسبة الحظ - eFootball</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff; min-height: 100vh; padding: 16px;
  }
  .container { max-width: 500px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 8px 0; color: #4da3ff; }
  .sub { color: #aaa; font-size: 13px; }
  .card {
    background: rgba(255,255,255,0.07); border-radius: 16px;
    padding: 16px; margin-bottom: 14px;
    border: 1px solid rgba(77,163,255,0.2);
    backdrop-filter: blur(8px);
  }
  .card h2 { font-size: 16px; margin: 0 0 10px; color: #4da3ff; }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: #ccc; }
  select, input {
    width: 100%; padding: 10px; border-radius: 10px;
    border: 1px solid #444; background: #1a1a2e; color: #fff;
    font-size: 15px; margin-bottom: 10px; font-family: inherit;
  }
  button {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: linear-gradient(90deg, #0a66ff, #4da3ff);
    color: #fff; font-size: 16px; font-weight: bold;
    cursor: pointer; font-family: inherit;
  }
  button:active { transform: scale(0.98); }
  #installBtn {
    background: linear-gradient(90deg, #0066ff, #00c6ff);
    display: none; margin-bottom: 14px;
    box-shadow: 0 4px 15px rgba(0,102,255,0.4);
  }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: rgba(77,163,255,0.1); padding: 12px; border-radius: 10px; text-align: center; }
  .stat .num { font-size: 22px; font-weight: bold; color: #4da3ff; }
  .stat .lbl { font-size: 11px; color: #aaa; margin-top: 4px; }
  .luck-meter {
    height: 20px; background: #1a1a2e; border-radius: 10px;
    overflow: hidden; margin: 10px 0;
  }
  .luck-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ff4d4d, #ffaa00, #00cc66);
    transition: width 0.5s ease;
  }
  ul { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; }
  li {
    padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 13px; display: flex; justify-content: space-between;
  }
  .rating-badge { padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
  .r-100 { background: #444; }
  .r-101 { background: #8b5cf6; }
  .r-102 { background: #3b82f6; }
  .r-103 { background: #06b6d4; }
  .r-104 { background: #10b981; }
  .r-105 { background: #eab308; color: #000; }
  .r-106 { background: #f97316; }
  .r-107 { background: #ef4444; }
  .r-108 { background: #ec4899; }
  .r-109 { background: #a855f7; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎯 حاسبة الحظ</h1>
    <div class="sub">eFootball | تسجيل وتحليل السحبات</div>
  </header>

  <button id="installBtn">📲 تثبيت التطبيق</button>

  <div class="card">
    <h2>📊 مؤشر الحظ الشخصي</h2>
    <div class="luck-meter"><div class="luck-fill" id="luckFill"></div></div>
    <div style="text-align:center;font-size:14px;" id="luckText">0%</div>
    <div class="stat-grid" style="margin-top:12px;">
      <div class="stat"><div class="num" id="totalOpens">0</div><div class="lbl">عدد السحبات</div></div>
      <div class="stat"><div class="num" id="strongPlayers">0</div><div class="lbl">لاعبين 105+</div></div>
      <div class="stat"><div class="num" id="bestTime">--</div><div class="lbl">أفضل وقت</div></div>
      <div class="stat"><div class="num" id="avgLuck">0</div><div class="lbl">متوسط الحظ</div></div>
    </div>
  </div>

  <div class="card">
    <h2>🎮 تسجيل سحبة جديدة</h2>
    <label>نوع البكج</label>
    <select id="packType">
      <option value="100">بكج 100 لاعب</option>
      <option value="40">بكج 40 لاعب</option>
      <option value="10">بكج 10 لاعبين</option>
      <option value="1">سحبة واحدة</option>
    </select>
    <label>أعلى تقييم طلعلك</label>
    <select id="rating">
      <option value="100">100 أو أقل</option>
      <option value="101">101</option>
      <option value="102">102</option>
      <option value="103">103</option>
      <option value="104">104</option>
      <option value="105">105</option>
      <option value="106">106</option>
      <option value="107">107</option>
      <option value="108">108</option>
      <option value="109">109+</option>
    </select>
    <button id="openBtn">🎲 سجل السحبة</button>
  </div>

  <div class="card">
    <h2>📈 إحصائيات اللاعبين</h2>
    <div id="playerStats" style="font-size:13px;color:#aaa;">ماكو بيانات بعد.</div>
  </div>

  <div class="card">
    <h2>🕐 سجل السحبات</h2>
    <ul id="history"><li style="color:#666;">ماكو سحبات مسجلة بعد.</li></ul>
  </div>
</div>

<script>
const STORAGE_KEY = 'efootball_luck_data';
let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"opens":[]}');

function calcLuck() {
  if (data.opens.length === 0) return 0;
  let totalScore = 0;
  data.opens.forEach(o => {
    let base = o.rating - 100;
    if (base < 0) base = 0;
    totalScore += base * 10;
  });
  return Math.min(100, Math.round(totalScore / data.opens.length));
}

function render() {
  const opens = data.opens;
  document.getElementById('totalOpens').textContent = opens.length;
  const strong = opens.filter(o => o.rating >= 105).length;
  document.getElementById('strongPlayers').textContent = strong;
  
  const luck = calcLuck();
  document.getElementById('luckFill').style.width = luck + '%';
  document.getElementById('luckText').textContent = luck + '%';
  document.getElementById('avgLuck').textContent = luck;

  // أفضل وقت
  if (opens.length > 0) {
    const hourCount = {};
    opens.forEach(o => {
      const h = new Date(o.time).getHours();
      hourCount[h] = (hourCount[h] || 0) + (o.rating - 100);
    });
    let bestHour = 0, bestVal = -1;
    for (const h in hourCount) {
      if (hourCount[h] > bestVal) { bestVal = hourCount[h]; bestHour = h; }
    }
    document.getElementById('bestTime').textContent = bestHour + ':00';
  }

  // إحصائيات اللاعبين
  const stats = {};
  opens.forEach(o => { stats[o.rating] = (stats[o.rating] || 0) + 1; });
  let statsHtml = '';
  Object.keys(stats).sort((a,b) => b-a).forEach(r => {
    statsHtml += `<div>تقييم ${r}: ${stats[r]} مرة</div>`;
  });
  document.getElementById('playerStats').innerHTML = statsHtml || 'ماكو بيانات بعد.';

  // السجل
  const hist = document.getElementById('history');
  if (opens.length === 0) {
    hist.innerHTML = '<li style="color:#666;">ماكو سحبات مسجلة بعد.</li>';
  } else {
    hist.innerHTML = opens.slice(-20).reverse().map(o => {
      const d = new Date(o.time);
      const t = d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
      const cls = 'r-' + Math.min(o.rating, 109);
      return `<li><span>بكج ${o.packType} | ${t}</span><span class="rating-badge ${cls}">${o.rating}</span></li>`;
    }).join('');
  }
}

document.getElementById('openBtn').addEventListener('click', () => {
  const packType = document.getElementById('packType').value;
  const rating = parseInt(document.getElementById('rating').value);
  data.opens.push({ packType, rating, time: Date.now() });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  render();
  alert('✅ تم تسجيل السحبة!');
});

// PWA Install
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  }
});

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

render();
</script>
</body>
</html>
