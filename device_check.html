
<section class="section fade-in" id="device">
  <h2>📱 اعرف جهازك</h2>
  <p style="text-align:center; color:#aaa; margin-bottom:20px;">
    اضغط الزر — وراح يطلعلك معلومات جهازك
  </p>
  
  <div style="text-align:center; margin-bottom:20px;">
    <button class="btn" onclick="showDevice()">🔍 افحص جهازي</button>
  </div>
  
  <div id="deviceResult" style="display:none;">
    <div class="grid">
      <div class="tool"><div class="icon">📱</div><div class="name">الجهاز</div><div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-name">-</div></div>
      <div class="tool"><div class="icon">💻</div><div class="name">النظام</div><div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-os">-</div></div>
      <div class="tool"><div class="icon">🌐</div><div class="name">المتصفح</div><div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-browser">-</div></div>
      <div class="tool"><div class="icon">📐</div><div class="name">الشاشة</div><div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-screen">-</div></div>
      <div class="tool"><div class="icon">🌍</div><div class="name">اللغة</div><div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-lang">-</div></div>
      <div class="tool"><div class="icon">⏰</div><div class="name">الوقت</div><div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-time">-</div></div>
      <div class="tool"><div class="icon">📶</div><div class="name">الاتصال</div><div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-net">-</div></div>
      <div class="tool"><div class="icon">🔋</div><div class="name">البطارية</div><div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-bat">-</div></div>
      <div class="tool"><div class="icon">🎨</div><div class="name">الألوان</div><div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-color">-</div></div>
      <div class="tool"><div class="icon">🔒</div><div class="name">الأمان</div><div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-sec">-</div></div>
    </div>
  </div>
</section>

<script>
function showDevice() {
  const ua = navigator.userAgent;
  document.getElementById('deviceResult').style.display = 'block';
  
  // الجهاز
  let device = 'غير معروف';
  if (/iPhone/.test(ua)) device = '📱 iPhone';
  else if (/iPad/.test(ua)) device = '📱 iPad';
  else if (/Huawei|HUAWEI/.test(ua)) device = '📱 Huawei';
  else if (/Samsung|SM-/.test(ua)) device = '📱 Samsung';
  else if (/Xiaomi|Redmi/.test(ua)) device = '📱 Xiaomi';
  else if (/OPPO/.test(ua)) device = '📱 OPPO';
  else if (/vivo/.test(ua)) device = '📱 vivo';
  else if (/Android/.test(ua)) device = '📱 Android';
  else if (/Windows/.test(ua)) device = '💻 Windows';
  else if (/Mac/.test(ua)) device = '💻 Mac';
  else if (/Linux/.test(ua)) device = '💻 Linux';
  
  // النظام
  let os = 'غير معروف';
  const am = ua.match(/Android (\d+(\.\d+)?)/);
  if (am) os = 'Android ' + am[1];
  else if (/iPhone OS (\d+)/.test(ua)) os = 'iOS ' + ua.match(/iPhone OS (\d+)/)[1];
  else if (/Windows NT 10/.test(ua)) os = 'Windows 10/11';
  else if (/Windows NT 6\.3/.test(ua)) os = 'Windows 8.1';
  else if (/Windows NT 6\.1/.test(ua)) os = 'Windows 7';
  else if (/Mac OS X/.test(ua)) os = 'macOS';
  else if (/Linux/.test(ua)) os = 'Linux';
  
  // المتصفح
  let browser = 'غير معروف';
  if (/Edg\//.test(ua)) browser = 'Edge';
  else if (/OPR\//.test(ua)) browser = 'Opera';
  else if (/Chrome\//.test(ua)) {
    const m = ua.match(/Chrome\/(\d+)/);
    browser = 'Chrome ' + (m ? m[1] : '');
  } else if (/Firefox\//.test(ua)) {
    const m = ua.match(/Firefox\/(\d+)/);
    browser = 'Firefox ' + (m ? m[1] : '');
  } else if (/Safari\//.test(ua)) browser = 'Safari';
  
  // الشاشة
  const screen_info = window.screen.width + '×' + window.screen.height;
  
  // اللغة
  const lang = navigator.language;
  
  // الوقت
  const time = new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'});
  
  // الاتصال
  const net = navigator.onLine ? '✅ متصل' : '❌ غير متصل';
  
  // الألوان
  const color = window.screen.colorDepth + '-bit';
  
  // الأمان
  const sec = location.protocol === 'https:' ? '🔒 HTTPS' : '⚠️ HTTP';
  
  // تحديث
  document.getElementById('dev-name').textContent = device;
  document.getElementById('dev-os').textContent = os;
  document.getElementById('dev-browser').textContent = browser;
  document.getElementById('dev-screen').textContent = screen_info;
  document.getElementById('dev-lang').textContent = lang;
  document.getElementById('dev-time').textContent = time;
  document.getElementById('dev-net').textContent = net;
  document.getElementById('dev-color').textContent = color;
  document.getElementById('dev-sec').textContent = sec;
  
  // البطارية
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      const pct = Math.round(b.level * 100);
      const chg = b.charging ? ' ⚡' : '';
      document.getElementById('dev-bat').textContent = pct + '%' + chg;
    });
  } else {
    document.getElementById('dev-bat').textContent = 'غير متاح';
  }
}
</script>
