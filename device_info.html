
<!-- قسم معلومات الجهاز -->
<section class="section fade-in" id="device">
  <h2>📱 معلومات جهازك</h2>
  <p style="text-align:center; color:#aaa; margin-bottom:20px;">
    هذي معلومات جهازك — يشوفها الزائر عن نفسه فقط
  </p>
  
  <div class="grid" id="deviceGrid">
    <div class="tool">
      <div class="icon">📱</div>
      <div class="name">الجهاز</div>
      <div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-device">...</div>
    </div>
    <div class="tool">
      <div class="icon">💻</div>
      <div class="name">النظام</div>
      <div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-os">...</div>
    </div>
    <div class="tool">
      <div class="icon">🌐</div>
      <div class="name">المتصفح</div>
      <div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-browser">...</div>
    </div>
    <div class="tool">
      <div class="icon">📐</div>
      <div class="name">الشاشة</div>
      <div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-screen">...</div>
    </div>
    <div class="tool">
      <div class="icon">🌍</div>
      <div class="name">اللغة</div>
      <div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-lang">...</div>
    </div>
    <div class="tool">
      <div class="icon">⏰</div>
      <div class="name">الوقت</div>
      <div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-time">...</div>
    </div>
    <div class="tool">
      <div class="icon">📶</div>
      <div class="name">الاتصال</div>
      <div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-net">...</div>
    </div>
    <div class="tool">
      <div class="icon">🔋</div>
      <div class="name">البطارية</div>
      <div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-bat">...</div>
    </div>
    <div class="tool">
      <div class="icon">🎨</div>
      <div class="name">الألوان</div>
      <div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-color">...</div>
    </div>
    <div class="tool">
      <div class="icon">🔒</div>
      <div class="name">الأمان</div>
      <div style="color:#fff; font-size:12px; margin-top:5px;" id="dev-secure">...</div>
    </div>
  </div>
</section>

<script>
// ═══ معلومات الجهاز ═══
(function() {
  const ua = navigator.userAgent;
  
  // الجهاز
  let device = 'غير معروف';
  if (/iPhone/.test(ua)) device = 'iPhone';
  else if (/iPad/.test(ua)) device = 'iPad';
  else if (/Huawei|HUAWEI/.test(ua)) device = 'Huawei';
  else if (/Samsung|SM-/.test(ua)) device = 'Samsung';
  else if (/Xiaomi|Redmi|MI /.test(ua)) device = 'Xiaomi';
  else if (/OPPO/.test(ua)) device = 'OPPO';
  else if (/vivo/.test(ua)) device = 'vivo';
  else if (/Android/.test(ua)) device = 'Android';
  else if (/Windows/.test(ua)) device = 'Windows PC';
  else if (/Mac/.test(ua)) device = 'Mac';
  else if (/Linux/.test(ua)) device = 'Linux';
  
  // نظام التشغيل
  let os = 'غير معروف';
  const androidMatch = ua.match(/Android (\d+(\.\d+)?)/);
  if (androidMatch) os = 'Android ' + androidMatch[1];
  else if (/iPhone OS (\d+)/.test(ua)) os = 'iOS ' + ua.match(/iPhone OS (\d+)/)[1];
  else if (/Windows NT 10/.test(ua)) os = 'Windows 10/11';
  else if (/Windows NT 6\.3/.test(ua)) os = 'Windows 8.1';
  else if (/Windows NT 6\.1/.test(ua)) os = 'Windows 7';
  else if (/Mac OS X/.test(ua)) os = 'macOS';
  else if (/Linux/.test(ua)) os = 'Linux';
  
  // المتصفح
  let browser = 'غير معروف';
  if (/Edg\//.test(ua)) browser = 'Edge';
  else if (/OPR\//.test(ua) || /Opera/.test(ua)) browser = 'Opera';
  else if (/Chrome\//.test(ua)) {
    const m = ua.match(/Chrome\/(\d+)/);
    browser = 'Chrome ' + (m ? m[1] : '');
  }
  else if (/Firefox\//.test(ua)) {
    const m = ua.match(/Firefox\/(\d+)/);
    browser = 'Firefox ' + (m ? m[1] : '');
  }
  else if (/Safari\//.test(ua)) browser = 'Safari';
  
  // الشاشة
  const screen_info = window.screen.width + '×' + window.screen.height;
  
  // اللغة
  const lang = navigator.language || navigator.userLanguage;
  
  // الوقت
  const time = new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'});
  
  // الاتصال
  const net = navigator.onLine ? '✅ متصل' : '❌ غير متصل';
  
  // البطارية
  let battery = 'جاري الفحص...';
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      battery = Math.round(b.level * 100) + '%' + (b.charging ? ' ⚡' : '');
      document.getElementById('dev-bat').textContent = battery;
    });
  } else {
    battery = 'غير متاح';
  }
  
  // الألوان
  const colorDepth = window.screen.colorDepth + '-bit';
  
  // الأمان
  const secure = location.protocol === 'https:' ? '🔒 HTTPS' : '⚠️ HTTP';
  
  // تحديث
  document.getElementById('dev-device').textContent = device;
  document.getElementById('dev-os').textContent = os;
  document.getElementById('dev-browser').textContent = browser;
  document.getElementById('dev-screen').textContent = screen_info;
  document.getElementById('dev-lang').textContent = lang;
  document.getElementById('dev-time').textContent = time;
  document.getElementById('dev-net').textContent = net;
  document.getElementById('dev-color').textContent = colorDepth;
  document.getElementById('dev-secure').textContent = secure;
  
  // تحديث الوقت كل دقيقة
  setInterval(() => {
    document.getElementById('dev-time').textContent = new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'});
  }, 60000);
  
  // تحديث الاتصال
  window.addEventListener('online', () => document.getElementById('dev-net').textContent = '✅ متصل');
  window.addEventListener('offline', () => document.getElementById('dev-net').textContent = '❌ غير متصل');
})();
</script>
