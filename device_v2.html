
<!-- قسم معلومات الجهاز الحقيقي -->
<section class="section fade-in" id="device">
  <h2>📱 اعرف جهازك الحقيقي</h2>
  <p style="text-align:center; color:#aaa; margin-bottom:25px;">
    معلومات جهازك الحقيقية — تظهر لك فقط، ولا تُحفظ في أي مكان
  </p>
  
  <div style="text-align:center; margin-bottom:25px;">
    <button class="btn" onclick="detectDevice()" id="detectBtn">🔍 افحص جهازي الآن</button>
    <button class="btn btn-outline" onclick="copyInfo()" id="copyBtn" style="display:none;">📋 نسخ المعلومات</button>
  </div>
  
  <div id="loadingBox" style="display:none; text-align:center; color:#00ff88; padding:20px;">
    <div style="font-size:30px; animation:pulse 1s infinite;">⚡</div>
    <p>جاري الفحص...</p>
  </div>
  
  <div id="deviceResult" style="display:none;">
    <div class="card" style="padding:0; overflow:hidden;">
      <table style="width:100%; border-collapse:collapse; font-size:14px;">
        <tr style="background:rgba(0,255,136,0.1);">
          <td style="padding:12px; color:#00ff88; width:40%; border-bottom:1px solid rgba(0,255,136,0.2);">📱 الجهاز</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-device">-</td>
        </tr>
        <tr>
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">💻 نظام التشغيل</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-os">-</td>
        </tr>
        <tr style="background:rgba(0,255,136,0.05);">
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">🌐 المتصفح</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-browser">-</td>
        </tr>
        <tr>
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">📐 دقة الشاشة</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-screen">-</td>
        </tr>
        <tr style="background:rgba(0,255,136,0.05);">
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">🎨 عمق الألوان</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-color">-</td>
        </tr>
        <tr>
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">🌍 اللغة</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-lang">-</td>
        </tr>
        <tr style="background:rgba(0,255,136,0.05);">
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">⏰ الوقت</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-time">-</td>
        </tr>
        <tr>
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">📶 حالة الاتصال</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-net">-</td>
        </tr>
        <tr style="background:rgba(0,255,136,0.05);">
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">🔋 البطارية</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-battery">-</td>
        </tr>
        <tr>
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">⚙️ عدد الأنوية</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-cpu">-</td>
        </tr>
        <tr style="background:rgba(0,255,136,0.05);">
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">💾 الذاكرة</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-ram">-</td>
        </tr>
        <tr>
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">👆 اللمس</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-touch">-</td>
        </tr>
        <tr style="background:rgba(0,255,136,0.05);">
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">🔒 الأمان</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-sec">-</td>
        </tr>
        <tr>
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">🌐 عنوان IP</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="r-ip">-</td>
        </tr>
        <tr style="background:rgba(0,255,136,0.05);">
          <td style="padding:12px; color:#00ff88;">📍 دولتك</td>
          <td style="padding:12px; color:#fff;" id="r-country">-</td>
        </tr>
      </table>
    </div>
  </div>
</section>

<script>
// ═══ كشف معلومات الجهاز ═══
async function detectDevice() {
  document.getElementById('loadingBox').style.display = 'block';
  document.getElementById('deviceResult').style.display = 'none';
  document.getElementById('copyBtn').style.display = 'none';
  document.getElementById('detectBtn').disabled = true;
  
  const ua = navigator.userAgent;
  const uaData = navigator.userAgentData;
  
  // === 1. الجهاز ===
  let device = 'جهاز غير معروف';
  
  // جرب userAgentData أولاً (Chrome/Android الجديد)
  if (uaData && uaData.platform) {
    device = uaData.platform;
  }
  
  // كشف Android
  if (/Android/.test(ua)) {
    // جرب استخراج موديل الجهاز
    const modelMatch = ua.match(/Android[^;]*;\s*([^;)]+?)(?:\s+Build|\))/i);
    if (modelMatch && modelMatch[1] && modelMatch[1].length > 2) {
      device = modelMatch[1].trim();
      device = device.replace(/^en-us;\s*/i, '').replace(/^wv$/i, '').trim();
    }
    
    // كشف الماركة
    if (/Huawei|HUAWEI/.test(ua)) device = '📱 Huawei - ' + device;
    else if (/Samsung|SM-/.test(ua)) device = '📱 Samsung - ' + device;
    else if (/Xiaomi|Redmi|MI /.test(ua)) device = '📱 Xiaomi - ' + device;
    else if (/OPPO/.test(ua)) device = '📱 OPPO - ' + device;
    else if (/vivo/.test(ua)) device = '📱 vivo - ' + device;
    else if (/OnePlus/.test(ua)) device = '📱 OnePlus - ' + device;
    else if (/Pixel/.test(ua)) device = '📱 Google Pixel';
    else device = '📱 ' + device;
  }
  else if (/iPhone/.test(ua)) {
    const m = ua.match(/iPhone OS (\d+)/);
    device = '📱 iPhone (iOS ' + (m ? m[1] : '') + ')';
  }
  else if (/iPad/.test(ua)) device = '📱 iPad';
  else if (/Macintosh|Mac OS/.test(ua)) device = '💻 Mac';
  else if (/Windows/.test(ua)) device = '💻 Windows PC';
  else if (/Linux/.test(ua)) device = '💻 Linux PC';
  
  // === 2. نظام التشغيل ===
  let os = 'غير معروف';
  const am = ua.match(/Android (\d+(\.\d+)?)/);
  if (am) os = 'Android ' + am[1];
  else if (/iPhone OS (\d+)_(\d+)/.test(ua)) {
    const m = ua.match(/iPhone OS (\d+)_(\d+)/);
    os = 'iOS ' + m[1] + '.' + m[2];
  }
  else if (/Windows NT 10/.test(ua)) os = 'Windows 10/11';
  else if (/Windows NT 6\.3/.test(ua)) os = 'Windows 8.1';
  else if (/Windows NT 6\.1/.test(ua)) os = 'Windows 7';
  else if (/Mac OS X (\d+)_(\d+)/.test(ua)) {
    const m = ua.match(/Mac OS X (\d+)_(\d+)/);
    os = 'macOS ' + m[1] + '.' + m[2];
  }
  else if (/Linux/.test(ua)) os = 'Linux';
  
  // === 3. المتصفح ===
  let browser = 'غير معروف';
  if (/Edg\//.test(ua)) {
    const m = ua.match(/Edg\/(\d+)/);
    browser = 'Microsoft Edge ' + (m ? m[1] : '');
  }
  else if (/OPR\//.test(ua)) {
    const m = ua.match(/OPR\/(\d+)/);
    browser = 'Opera ' + (m ? m[1] : '');
  }
  else if (/Chrome\//.test(ua) && !/Edg|OPR/.test(ua)) {
    const m = ua.match(/Chrome\/(\d+)/);
    browser = 'Google Chrome ' + (m ? m[1] : '');
  }
  else if (/Firefox\//.test(ua)) {
    const m = ua.match(/Firefox\/(\d+)/);
    browser = 'Mozilla Firefox ' + (m ? m[1] : '');
  }
  else if (/Safari\//.test(ua)) {
    const m = ua.match(/Version\/(\d+)/);
    browser = 'Apple Safari ' + (m ? m[1] : '');
  }
  
  // === 4. الشاشة ===
  const sw = window.screen.width;
  const sh = window.screen.height;
  const screen_info = sw + ' × ' + sh + ' بكسل';
  
  // === 5. عمق الألوان ===
  const color = window.screen.colorDepth + ' بت';
  
  // === 6. اللغة ===
  const lang = navigator.language || navigator.userLanguage || 'غير معروف';
  
  // === 7. الوقت ===
  const now = new Date();
  const time = now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'}) + ' - ' + now.toLocaleDateString('ar-EG');
  
  // === 8. الاتصال ===
  let net = navigator.onLine ? '✅ متصل بالإنترنت' : '❌ غير متصل';
  if (navigator.connection) {
    const c = navigator.connection;
    if (c.effectiveType) net += ' (' + c.effectiveType.toUpperCase() + ')';
  }
  
  // === 9. البطارية ===
  let battery = 'غير متاح';
  if (navigator.getBattery) {
    try {
      const b = await navigator.getBattery();
      const pct = Math.round(b.level * 100);
      const chg = b.charging ? ' ⚡ جاري الشحن' : '';
      battery = pct + '%' + chg;
    } catch(e) {}
  }
  
  // === 10. عدد الأنوية ===
  const cpu = navigator.hardwareConcurrency ? navigator.hardwareConcurrency + ' نواة' : 'غير متاح';
  
  // === 11. الذاكرة ===
  const ram = navigator.deviceMemory ? '~' + navigator.deviceMemory + ' GB' : 'غير متاح';
  
  // === 12. اللمس ===
  const touch = 'ontouchstart' in window ? '✅ شاشة لمس' : '❌ بدون لمس';
  
  // === 13. الأمان ===
  const sec = location.protocol === 'https:' ? '🔒 HTTPS (آمن)' : '⚠️ HTTP (غير آمن)';
  
  // === 14. IP + الدولة ===
  let ip = '...';
  let country = '...';
  try {
    const res = await fetch('https://ipapi.co/json/');
    const data = await res.json();
    ip = data.ip || 'غير معروف';
    country = (data.country_name || 'غير معروف') + ' ' + (data.country_code ? '(' + data.country_code + ')' : '');
  } catch(e) {
    ip = 'غير متاح';
    country = 'غير متاح';
  }
  
  // === تحديث الجدول ===
  document.getElementById('r-device').textContent = device;
  document.getElementById('r-os').textContent = os;
  document.getElementById('r-browser').textContent = browser;
  document.getElementById('r-screen').textContent = screen_info;
  document.getElementById('r-color').textContent = color;
  document.getElementById('r-lang').textContent = lang;
  document.getElementById('r-time').textContent = time;
  document.getElementById('r-net').textContent = net;
  document.getElementById('r-battery').textContent = battery;
  document.getElementById('r-cpu').textContent = cpu;
  document.getElementById('r-ram').textContent = ram;
  document.getElementById('r-touch').textContent = touch;
  document.getElementById('r-sec').textContent = sec;
  document.getElementById('r-ip').textContent = ip;
  document.getElementById('r-country').textContent = country;
  
  // === إخفاء التحميل وإظهار النتيجة ===
  document.getElementById('loadingBox').style.display = 'none';
  document.getElementById('deviceResult').style.display = 'block';
  document.getElementById('copyBtn').style.display = 'inline-block';
  document.getElementById('detectBtn').disabled = false;
  
  // احفظ البيانات للنسخ
  window._deviceInfo = {
    'الجهاز': device,
    'نظام التشغيل': os,
    'المتصفح': browser,
    'دقة الشاشة': screen_info,
    'عمق الألوان': color,
    'اللغة': lang,
    'الوقت': time,
    'الاتصال': net,
    'البطارية': battery,
    'عدد الأنوية': cpu,
    'الذاكرة': ram,
    'اللمس': touch,
    'الأمان': sec,
    'IP': ip,
    'الدولة': country
  };
}

// ═══ نسخ المعلومات ═══
function copyInfo() {
  if (!window._deviceInfo) return;
  let text = '📱 معلومات جهازي (من موقع Abu Kamila Karrar)\n';
  text += '═══════════════════════════════════\n';
  for (const [k, v] of Object.entries(window._deviceInfo)) {
    text += `• ${k}: ${v}\n`;
  }
  text += '═══════════════════════════════════\n';
  text += '🌐 https://krarfsywh-sys.github.io/Abu-Kamila-/';
  
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ تم النسخ!';
    setTimeout(() => btn.textContent = '📋 نسخ المعلومات', 2000);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ تم النسخ!';
    setTimeout(() => btn.textContent = '📋 نسخ المعلومات', 2000);
  });
}
</script>
