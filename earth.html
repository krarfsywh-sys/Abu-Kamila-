
<!-- كوكب أرضي 3D -->
<section class="section fade-in" id="earth">
  <h2>🌍 كوكب زوار موقعي</h2>
  <p style="text-align:center; color:#aaa; margin-bottom:25px;">
    شوف زوار موقعك من كل العالم — مباشر
  </p>

  <!-- الكرة الأرضية -->
  <div class="card" style="padding:0; overflow:hidden; border-color:#00ff88; position:relative;">
    <div id="earthContainer" style="width:100%; height:400px; background:radial-gradient(circle at 50% 50%, #001a10, #000);"></div>
    
    <!-- الإحصائيات فوق -->
    <div style="position:absolute; top:15px; left:15px; background:rgba(0,0,0,0.8); padding:10px 15px; border-radius:10px; border:1px solid #00ff88;">
      <div style="color:#00ff88; font-size:11px;">🌐 الزوار الآن</div>
      <div id="liveCount" style="color:#fff; font-size:22px; font-weight:bold; font-family:monospace;">0</div>
    </div>

    <!-- موقعك -->
    <div style="position:absolute; top:15px; right:15px; background:rgba(0,0,0,0.8); padding:10px 15px; border-radius:10px; border:1px solid #ffaa00;">
      <div style="color:#ffaa00; font-size:11px;">📍 أنت من</div>
      <div id="myCountry" style="color:#fff; font-size:14px; font-weight:bold;">...</div>
    </div>
  </div>

  <!-- قائمة الزوار -->
  <div style="margin-top:20px;">
    <p style="color:#00ff88; font-size:14px; margin-bottom:12px;">🌍 آخر الزوار:</p>
    <div id="visitorsList" style="display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto;"></div>
  </div>

  <p style="text-align:center; color:#666; font-size:11px; margin-top:15px;">
    ℹ️ الزوار يظهرون مباشرة — البيانات وهمية للعرض
  </p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══ كوكب أرضي 3D ═══
(function() {
  const container = document.getElementById('earthContainer');
  if (!container) return;

  // ═══ 1. إعداد المشهد ═══
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.z = 3.5;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // ═══ 2. الكرة الأرضية ═══
  const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
  
  // تحميل خريطة الأرض (من CDN مجاني)
  const textureLoader = new THREE.TextureLoader();
  const earthTexture = textureLoader.load(
    'https://unpkg.com/three-globe/example/img/earth-dark.jpg',
    undefined,
    undefined,
    () => {
      // إذا فشل تحميل الصورة، نستخدم لون بديل
      earthMaterial.color.setHex(0x0a3d2a);
    }
  );

  const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthTexture,
    color: 0x00ff88,
    emissive: 0x003322,
    shininess: 5,
    transparent: true,
    opacity: 0.95
  });

  const earth = new THREE.Mesh(earthGeometry, earthMaterial);
  scene.add(earth);

  // ═══ 3. إضاءة ═══
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0x00ff88, 1.2);
  directionalLight.position.set(5, 3, 5);
  scene.add(directionalLight);

  const backLight = new THREE.DirectionalLight(0x00ccff, 0.5);
  backLight.position.set(-5, -3, -5);
  scene.add(backLight);

  // ═══ 4. هالة الخلفية ═══
  const starsGeometry = new THREE.BufferGeometry();
  const starsCount = 800;
  const starPositions = new Float32Array(starsCount * 3);
  
  for (let i = 0; i < starsCount * 3; i += 3) {
    starPositions[i] = (Math.random() - 0.5) * 100;
    starPositions[i+1] = (Math.random() - 0.5) * 100;
    starPositions[i+2] = (Math.random() - 0.5) * 100;
  }
  
  starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starsMaterial = new THREE.PointsMaterial({ color: 0x00ff88, size: 0.15, transparent: true, opacity: 0.7 });
  const stars = new THREE.Points(starsGeometry, starsMaterial);
  scene.add(stars);

  // ═══ 5. النقاط (الزوار) ═══
  const visitorDots = [];
  const COUNTRIES = [
    { name: 'العراق', flag: '🇮🇶', lat: 33.3, lon: 44.4 },
    { name: 'السعودية', flag: '🇸🇦', lat: 24.7, lon: 46.7 },
    { name: 'الإمارات', flag: '🇦🇪', lat: 23.4, lon: 53.8 },
    { name: 'مصر', flag: '🇪🇬', lat: 26.8, lon: 30.8 },
    { name: 'تركيا', flag: '🇹🇷', lat: 38.9, lon: 35.2 },
    { name: 'إيران', flag: '🇮🇷', lat: 32.4, lon: 53.7 },
    { name: 'الأردن', flag: '🇯🇴', lat: 30.6, lon: 36.2 },
    { name: 'الكويت', flag: '🇰🇼', lat: 29.3, lon: 47.5 },
    { name: 'قطر', flag: '🇶🇦', lat: 25.3, lon: 51.2 },
    { name: 'البحرين', flag: '🇧🇭', lat: 26.0, lon: 50.5 },
    { name: 'لبنان', flag: '🇱🇧', lat: 33.8, lon: 35.8 },
    { name: 'سوريا', flag: '🇸🇾', lat: 34.8, lon: 38.9 },
    { name: 'المغرب', flag: '🇲🇦', lat: 31.8, lon: -7.1 },
    { name: 'الجزائر', flag: '🇩🇿', lat: 28.0, lon: 1.7 },
    { name: 'تونس', flag: '🇹🇳', lat: 33.9, lon: 9.5 },
    { name: 'ليبيا', flag: '🇱🇾', lat: 26.3, lon: 17.2 },
    { name: 'اليمن', flag: '🇾🇪', lat: 15.6, lon: 48.5 },
    { name: 'عمان', flag: '🇴🇲', lat: 21.5, lon: 55.9 },
    { name: 'أمريكا', flag: '🇺🇸', lat: 37.1, lon: -95.7 },
    { name: 'بريطانيا', flag: '🇬🇧', lat: 55.4, lon: -3.4 },
    { name: 'ألمانيا', flag: '🇩🇪', lat: 51.2, lon: 10.5 },
    { name: 'فرنسا', flag: '🇫🇷', lat: 46.2, lon: 2.2 },
    { name: 'اليابان', flag: '🇯🇵', lat: 36.2, lon: 138.3 },
    { name: 'الصين', flag: '🇨🇳', lat: 35.9, lon: 104.2 },
    { name: 'الهند', flag: '🇮🇳', lat: 20.6, lon: 78.9 },
    { name: 'أستراليا', flag: '🇦🇺', lat: -25.3, lon: 133.8 },
    { name: 'كندا', flag: '🇨🇦', lat: 56.1, lon: -106.3 },
    { name: 'البرازيل', flag: '🇧🇷', lat: -14.2, lon: -51.9 },
    { name: 'روسيا', flag: '🇷🇺', lat: 61.5, lon: 105.3 },
    { name: 'إيطاليا', flag: '🇮🇹', lat: 41.9, lon: 12.6 }
  ];

  // تحويل lat/lon إلى إحداثيات 3D
  function latLonToVector3(lat, lon, radius) {
    const phi = (90 - lat) * Math.PI / 180;
    const theta = lon * Math.PI / 180;
    const x = radius * Math.sin(phi) * Math.cos(theta);
    const y = radius * Math.cos(phi);
    const z = -radius * Math.sin(phi) * Math.sin(theta);
    return new THREE.Vector3(x, y, z);
  }

  // إضافة نقطة للكرة
  function addVisitorDot(country, isNew = false) {
    const dotGeometry = new THREE.SphereGeometry(isNew ? 0.025 : 0.018, 8, 8);
    const dotMaterial = new THREE.MeshBasicMaterial({ 
      color: isNew ? 0xff0044 : 0x00ff88,
      transparent: true,
      opacity: 0.95
    });
    const dot = new THREE.Mesh(dotGeometry, dotMaterial);
    const pos = latLonToVector3(country.lat, country.lon, 1.02);
    dot.position.copy(pos);
    dot.userData = country;
    dot.userData.birth = Date.now();
    scene.add(dot);
    visitorDots.push(dot);
    return dot;
  }

  // ═══ 6. طائرات طيران من الزوار ═══
  function addArc(from, to) {
    const start = latLonToVector3(from.lat, from.lon, 1.02);
    const end = latLonToVector3(to.lat, to.lon, 1.02);
    
    const mid = start.clone().add(end).multiplyScalar(0.5);
    mid.normalize().multiplyScalar(1.3);
    
    const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
    const points = curve.getPoints(30);
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({ 
      color: 0x00ff88, 
      transparent: true, 
      opacity: 0.5 
    });
    const line = new THREE.Line(geometry, material);
    scene.add(line);
    return line;
  }

  // ═══ 7. الزوار ═══
  const visitors = [];
  const myCountry = COUNTRIES[0]; // العراق كمثال
  
  // إضافة نقاط عشوائية
  function addRandomVisitor() {
    const country = COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)];
    const isNew = Math.random() > 0.5;
    
    addVisitorDot(country, isNew);
    
    // إضافة قوس طيران (من البلد للعراق)
    if (Math.random() > 0.5) {
      addArc(country, myCountry);
    }
    
    // إضافة للقائمة
    visitors.unshift({
      ...country,
      time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
    });
    if (visitors.length > 15) visitors.pop();
    
    updateVisitorsList();
    updateLiveCount();
  }

  function updateVisitorsList() {
    const list = document.getElementById('visitorsList');
    if (!list) return;
    list.innerHTML = visitors.map(v => `
      <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; background:rgba(0,255,136,0.05); border-radius:8px; border:1px solid rgba(0,255,136,0.2);">
        <span style="font-size:20px;">${v.flag}</span>
        <span style="flex:1; color:#fff; font-size:13px;">${v.name}</span>
        <span style="color:#666; font-size:11px;">${v.time}</span>
      </div>
    `).join('');
  }

  function updateLiveCount() {
    const count = document.getElementById('liveCount');
    if (!count) return;
    const n = 8 + Math.floor(Math.random() * 15);
    count.textContent = n;
  }

  // ═══ 8. معلومات زائرك ═══
  async function getMyLocation() {
    try {
      const r = await fetch('https://ipapi.co/json/');
      const data = await r.json();
      const el = document.getElementById('myCountry');
      if (el) {
        el.textContent = (data.country_name || 'غير معروف') + ' ' + (data.country_code === 'IQ' ? '🇮🇶' : '');
      }
    } catch(e) {
      document.getElementById('myCountry').textContent = 'غير متاح';
    }
  }

  // ═══ 9. تشغيل ═══
  // إضافة 5 زوار أولي
  for (let i = 0; i < 5; i++) {
    setTimeout(() => addRandomVisitor(), i * 500);
  }

  // إضافة زائر كل 3 ثواني
  setInterval(addRandomVisitor, 3000);

  // تحديث العداد
  setInterval(updateLiveCount, 5000);

  // جلب موقعك
  getMyLocation();

  // ═══ 10. تحريك ═══
  let mouseX = 0, mouseY = 0;
  let targetX = 0, targetY = 0;

  container.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouseY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    targetY = mouseX * 0.5;
    targetX = -mouseY * 0.5;
  });

  // للموبايل — لمس
  container.addEventListener('touchmove', (e) => {
    const rect = container.getBoundingClientRect();
    const touch = e.touches[0];
    mouseX = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
    mouseY = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
    targetY = mouseX * 0.5;
    targetX = -mouseY * 0.5;
  });

  // ═══ 11. دوران مستمر ═══
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();

    // دوران الكرة
    earth.rotation.y = elapsed * 0.1;

    // إمالة حسب الماوس
    earth.rotation.x += (targetX - earth.rotation.x) * 0.05;
    earth.rotation.z += (targetY * 0.2 - earth.rotation.z) * 0.05;

    // النقاط تدور مع الكرة
    visitorDots.forEach(dot => {
      const age = Date.now() - dot.userData.birth;
      // نبض النقطة الجديدة
      if (dot.material.color.getHex() === 0xff0044) {
        const scale = 1 + Math.sin(elapsed * 5) * 0.3;
        dot.scale.set(scale, scale, scale);
      }
      // إخفاء تدريجي بعد 15 ثانية
      if (age > 15000) {
        dot.material.opacity -= 0.005;
        if (dot.material.opacity <= 0) {
          scene.remove(dot);
          const idx = visitorDots.indexOf(dot);
          if (idx > -1) visitorDots.splice(idx, 1);
        }
      }
    });

    // النجوم تدور
    stars.rotation.y = elapsed * 0.02;

    renderer.render(scene, camera);
  }

  animate();

  // ═══ 12. تحجيم ═══
  window.addEventListener('resize', () => {
    if (!container) return;
    const w = container.clientWidth;
    const h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

})();
</script>
