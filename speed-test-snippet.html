<style>
#karrar-speed-test{
max-width:650px;margin:30px auto;padding:25px;
border:2px solid #00ff91;border-radius:25px;
background:#03150d;color:#fff;text-align:center;
font-family:Arial,Tahoma,sans-serif;
box-shadow:0 0 30px #00ff9133
}
#karrar-speed-test h2{color:#00ff91;font-size:28px}
#kst-start{
border:0;border-radius:15px;padding:15px 30px;
background:#00ff91;color:#00150d;
font-size:18px;font-weight:bold
}
.kst-grid{
display:grid;grid-template-columns:1fr 1fr;
gap:12px;margin-top:20px
}
.kst-box{
background:#ffffff0d;border-radius:15px;padding:15px
}
.kst-label{color:#9fb2aa}
.kst-value{font-size:22px;font-weight:bold;margin-top:6px}
#kst-result{margin-top:20px;padding:15px;border-radius:15px;font-size:20px;font-weight:bold}
#kst-main{font-size:55px;color:#00ff91;font-weight:bold}
@media(max-width:500px){.kst-grid{grid-template-columns:1fr}}
</style>

<section id="karrar-speed-test">
<h2>🎮⚡ اختبار سرعة الإنترنت</h2>
<p>اختبار حقيقي للـ Ping و Jitter و Download و Upload</p>

<div id="kst-main">0</div>
<div>Mbps</div>
<p id="kst-status">اضغط الزر لبدء الاختبار</p>

<button id="kst-start">🚀 ابدأ اختبار السرعة</button>

<div class="kst-grid">
<div class="kst-box">
<div class="kst-label">🏓 Ping</div>
<div class="kst-value" id="kst-ping">-- ms</div>
</div>

<div class="kst-box">
<div class="kst-label">📊 Jitter</div>
<div class="kst-value" id="kst-jitter">-- ms</div>
</div>

<div class="kst-box">
<div class="kst-label">⬇️ Download</div>
<div class="kst-value" id="kst-down">-- Mbps</div>
</div>

<div class="kst-box">
<div class="kst-label">⬆️ Upload</div>
<div class="kst-value" id="kst-up">-- Mbps</div>
</div>
</div>

<div id="kst-result">🎮 لم يبدأ الاختبار</div>
</section>

<script>
(function(){

const $=x=>document.getElementById(x);
const btn=$("kst-start");

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function pingTest(){

let a=[];

for(let i=0;i<6;i++){

let s=performance.now();

try{
await fetch(
"https://www.gstatic.com/generate_204?x="+Date.now(),
{cache:"no-store",mode:"no-cors"}
);

a.push(performance.now()-s);
}catch(e){}

await sleep(80);
}

if(!a.length) throw Error("PING");

let avg=a.reduce((x,y)=>x+y,0)/a.length;

let jitter=0;

for(let i=1;i<a.length;i++)
jitter+=Math.abs(a[i]-a[i-1]);

return{
ping:avg,
jitter:jitter/(a.length-1)
};

}

async function downloadTest(){

let total=0;
let time=0;

for(const size of [1000000,5000000,10000000]){

$("kst-status").textContent="⬇️ جاري اختبار Download...";

let s=performance.now();

let r=await fetch(
"https://speed.cloudflare.com/__down?bytes="+
size+"&x="+Date.now(),
{cache:"no-store"}
);

let b=await r.blob();

let t=(performance.now()-s)/1000;

total+=b.size;
time+=t;

let speed=b.size*8/t/1000000;

$("kst-main").textContent=speed.toFixed(1);
$("kst-down").textContent=speed.toFixed(2)+" Mbps";

}

return total*8/time/1000000;

}

async function uploadTest(){

let total=0;
let time=0;

for(const size of [500000,1000000,2000000]){

$("kst-status").textContent="⬆️ جاري اختبار Upload...";

let data=new Uint8Array(size);

let s=performance.now();

await fetch(
"https://speed.cloudflare.com/__up?x="+Date.now(),
{
method:"POST",
body:data,
cache:"no-store"
}
);

let t=(performance.now()-s)/1000;

total+=size;
time+=t;

let speed=size*8/t/1000000;

$("kst-up").textContent=speed.toFixed(2)+" Mbps";

}

return total*8/time/1000000;

}

function rating(p,j,d,u){

if(p<=60&&j<=15&&d>=10&&u>=3){

$("kst-result").innerHTML=
"🟢 مناسب جداً للألعاب<br><small>اتصال جيد للألعاب أونلاين</small>";

}else if(p<=100&&j<=30&&d>=5&&u>=1){

$("kst-result").innerHTML=
"🟡 قابل للألعاب<br><small>قد يظهر تأخير أحياناً</small>";

}else{

$("kst-result").innerHTML=
"🔴 غير مناسب للألعاب حالياً<br><small>قد تواجه تأخير أو تقطيع</small>";

}

}

btn.onclick=async function(){

btn.disabled=true;
btn.textContent="⏳ جاري الاختبار...";

try{

$("kst-status").textContent="🏓 قياس Ping و Jitter...";

let p=await pingTest();

$("kst-ping").textContent=Math.round(p.ping)+" ms";
$("kst-jitter").textContent=Math.round(p.jitter)+" ms";

let d=await downloadTest();

$("kst-down").textContent=d.toFixed(2)+" Mbps";

let u=await uploadTest();

$("kst-up").textContent=u.toFixed(2)+" Mbps";

rating(p.ping,p.jitter,d,u);

$("kst-status").textContent="✅ اكتمل الاختبار";

}catch(e){

$("kst-status").textContent="❌ تعذر إكمال الاختبار";
$("kst-result").textContent="⚠️ حدث خطأ أثناء الاختبار";

}

btn.disabled=false;
btn.textContent="🔄 إعادة الاختبار";

};

})();
</script>
