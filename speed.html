<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار سرعة الإنترنت</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b0f19;
    color:white;
    font-family:Arial,sans-serif;
}

.box{
    width:90%;
    max-width:420px;
    background:#151b29;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 30px #000;
}

h1{
    margin-top:0;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#2878ff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    font-size:18px;
    line-height:2;
}
</style>
</head>

<body>

<div class="box">
    <h1>⚡ اختبار سرعة الإنترنت</h1>

    <button onclick="startTest()">
        ابدأ الاختبار
    </button>

    <div class="result" id="result">
        اضغط ابدأ
    </div>
</div>

<script>
async function startTest(){

    const result = document.getElementById("result");

    result.innerHTML = "⏳ جاري الاختبار...";

    // قياس Ping
    const startPing = performance.now();

    try{
        await fetch(
            "https://www.gstatic.com/generate_204",
            {cache:"no-store", mode:"no-cors"}
        );
    }catch(e){}

    const ping = Math.round(performance.now() - startPing);

    // تحميل ملف تجريبي
    const url =
        "https://speed.cloudflare.com/__down?bytes=5000000&x="
        + Date.now();

    const startDownload = performance.now();

    try{

        const response = await fetch(
            url,
            {cache:"no-store"}
        );

        const data = await response.blob();

        const seconds =
            (performance.now() - startDownload) / 1000;

        const megabits =
            (data.size * 8) / seconds / 1000000;

        result.innerHTML =
            "🏓 Ping: " + ping + " ms<br>" +
            "⬇️ Download: " + megabits.toFixed(2) + " Mbps<br>" +
            "ℹ️ اختبار التحميل مكتمل";

    }catch(error){

        result.innerHTML =
            "❌ تعذر إجراء اختبار التحميل<br>" +
            "Ping: " + ping + " ms";
    }
}
</script>

</body>
</html>
