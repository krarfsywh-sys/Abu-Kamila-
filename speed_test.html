
<!-- اختبار سرعة النت - مباشر -->
<section class="section fade-in" id="speed">
  <h2>⚡ اختبار سرعة النت</h2>
  <p style="text-align:center; color:#aaa; margin-bottom:25px;">
    اختبار حقيقي — الأرقام تتغير مباشرة
  </p>

  <div style="text-align:center; margin-bottom:25px;">
    <button 
      onclick="startTest()" 
      id="startBtn"
      style="padding:20px 50px; background:linear-gradient(135deg, #00ff88, #00cc66); color:#000; border:none; border-radius:50px; font-size:20px; font-weight:bold; cursor:pointer; box-shadow:0 0 30px rgba(0,255,136,0.6); transition:0.3s; font-family:inherit;"
    >
      🚀 ابدأ الاختبار
    </button>
  </div>

  <!-- شريط التقدم -->
  <div id="progressBox" style="display:none; margin-bottom:25px;">
    <div style="background:#111; height:10px; border-radius:10px; overflow:hidden;">
      <div id="progressBar" style="height:100%; width:0%; background:linear-gradient(90deg, #00ff88, #00cc66); transition:width 0.3s; box-shadow:0 0 15px #00ff88;"></div>
    </div>
    <p id="progressText" style="text-align:center; color:#00ff88; margin-top:10px; font-size:14px;">جاري التهيئة...</p>
  </div>

  <!-- العدادات المباشرة -->
  <div id="liveBox" style="display:none; margin-bottom:25px;">
    
    <!-- البينغ -->
    <div class="card" style="text-align:center; padding:25px; border-color:#ffaa00; margin-bottom:15px;">
      <div style="font-size:30px; margin-bottom:10px;">📡</div>
      <div style="color:#aaa; font-size:13px; margin-bottom:5px;">البينغ</div>
      <div id="pingLive" style="color:#ffaa00; font-size:52px; font-weight:bold; font-family:monospace; text-shadow:0 0 20px #ffaa00;">0</div>
      <div style="color:#666; font-size:12px;">ms</div>
    </div>

    <!-- التحميل -->
    <div class="card" style="text-align:center; padding:25px; border-color:#00ff88; margin-bottom:15px;">
      <div style="font-size:30px; margin-bottom:10px;">⬇️</div>
      <div style="color:#aaa; font-size:13px; margin-bottom:5px;">سرعة التحميل</div>
      <div id="dlLive" style="color:#00ff88; font-size:52px; font-weight:bold; font-family:monospace; text-shadow:0 0 20px #00ff88;">0.0</div>
      <div style="color:#666; font-size:12px;">Mbps</div>
    </div>

    <!-- الرفع -->
    <div class="card" style="text-align:center; padding:25px; border-color:#00ccff;">
      <div style="font-size:30px; margin-bottom:10px;">⬆️</div>
      <div style="color:#aaa; font-size:13px; margin-bottom:5px;">سرعة الرفع</div>
      <div id="ulLive" style="color:#00ccff; font-size:52px; font-weight:bold; font-family:monospace; text-shadow:0 0 20px #00ccff;">0.0</div>
      <div style="color:#666; font-size:12px;">Mbps</div>
    </div>

    <!-- النتيجة النهائية -->
    <div id="finalBox" class="card" style="text-align:center; padding:20px; margin-top:20px;">
      <div style="color:#aaa; font-size:13px; margin-bottom:10px;">النتيجة النهائية</div>
      <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;">
        <div>
          <div id="dlFinal" style="color:#00ff88; font-size:22px; font-weight:bold;">0</div>
          <div style="color:#666; font-size:10px;">⬇️ تحميل</div>
        </div>
        <div>
          <div id="ulFinal" style="color:#00ccff; font-size:22px; font-weight:bold;">0</div>
          <div style="color:#666; font-size:10px;">⬆️ رفع</div>
        </div>
        <div>
          <div id="pingFinal" style="color:#ffaa00; font-size:22px; font-weight:bold;">0</div>
          <div style="color:#666; font-size:10px;">📡 بينغ</div>
        </div>
      </div>
    </div>

  </div>

  <!-- التفاصيل -->
  <div id="detailsBox" style="display:none;">
    <div class="card" style="padding:0; overflow:hidden;">
      <table style="width:100%; border-collapse:collapse; font-size:14px;">
        <tr style="background:rgba(0,255,136,0.1);">
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">📡 مزود الخدمة (IP)</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="d-ip">-</td>
        </tr>
        <tr>
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">📍 الموقع</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="d-loc">-</td>
        </tr>
        <tr style="background:rgba(0,255,136,0.05);">
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">🔌 نوع الاتصال</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="d-type">-</td>
        </tr>
        <tr>
          <td style="padding:12px; color:#00ff88; border-bottom:1px solid rgba(0,255,136,0.2);">🕐 وقت الاختبار</td>
          <td style="padding:12px; color:#fff; border-bottom:1px solid rgba(0,255,136,0.2);" id="d-time">-</td>
        </tr>
        <tr style="background:rgba(0,255,136,0.05);">
          <td style="padding:12px; color:#00ff88;">🎮 جودة اللعب</td>
          <td style="padding:12px; color:#fff;" id="d-gaming">-</td>
        </tr>
      </table>
    </div>

    <div style="text-align:center; margin-top:20px;">
      <button onclick="shareResult()" class="btn btn-outline" style="padding:12px 25px;">📤 مشاركة</button>
      <button onclick="startTest()" class="btn" style="padding:12px 25px; background:#00ff88; color:#000; border:none; border-radius:30px; font-weight:bold; cursor:pointer;">🔄 اختبار جديد</button>
    </div>
  </div>

</section>

<script>
// ═══ اختبار سرعة النت المباشر ═══
let isTesting = false;

async function startTest() {
  if (isTesting) return;
  isTesting = true;

  // إعادة تعيين
  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').textContent = '⏳ جاري الاختبار...';
  document.getElementById('progressBox').style.display = 'block';
  document.getElementById('liveBox').style.display = 'block';
  document.getElementById('detailsBox').style.display = 'none';

  document.getElementById('pingLive').textContent = '0';
  document.getElementById('dlLive').textContent = '0.0';
  document.getElementById('ulLive').textContent = '0.0';
  document.getElementById('dlFinal').textContent = '0';
  document.getElementById('ulFinal').textContent = '0';
  document.getElementById('pingFinal').textContent = '0';

  // ═══ 1. البينغ (5 قياسات — الرقم يتغير) ═══
  setProgress(5, '📡 قياس البينغ...');
  const pings = [];
  for (let i = 0; i < 5; i++) {
    const start = performance.now();
    try {
      await fetch('https://speed.cloudflare.com/__down?bytes=1000&t=' + Date.now(), { cache: 'no-store' });
      const time = performance.now() - start;
      pings.push(time);
      document.getElementById('pingLive').textContent = Math.round(time);
      await sleep(150);
    } catch(e) {}
  }
  const avgPing = pings.length > 0 ? Math.round(pings.reduce((a,b) => a+b, 0) / pings.length) : 0;
  document.getElementById('pingLive').textContent = avgPing;
  document.getElementById('pingFinal').textContent = avgPing;

  // ═══ 2. التحميل (الرقم يتغير مباشرة) ═══
  setProgress(15, '⬇️ قياس سرعة التحميل...');
  const dl = await testDownloadLive();
  document.getElementById('dlFinal').textContent = dl;

  // ═══ 3. الرفع ═══
  setProgress(75, '⬆️ قياس سرعة الرفع...');
  const ul = await testUploadLive();
  document.getElementById('ulFinal').textContent = ul;

  // ═══ 4. المعلومات ═══
  setProgress(95, '🌐 جلب المعلومات...');
  await getInfo();

  // ═══ 5. التقييم ═══
  setProgress(100, '✅ اكتمل!');
  await sleep(800);
  document.getElementById('progressBox').style.display = 'none';
  document.getElementById('detailsBox').style.display = 'block';

  // إضافة التقييم
  const rating = getRating(dl, ul, avgPing);
  document.getElementById('d-gaming').innerHTML = rating.gaming;

  // حفظ
  window._testResult = {
    download: dl,
    upload: ul,
    ping: avgPing,
    time: new Date().toLocaleString('ar-EG')
  };

  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').textContent = '🚀 ابدأ الاختبار';
  isTesting = false;
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function setProgress(percent, text) {
  document.getElementById('progressBar').style.width = percent + '%';
  document.getElementById('progressText').textContent = text;
}

// ═══ التحميل - الرقم يتغير مباشرة ═══
async function testDownloadLive() {
  const testUrl = 'https://speed.cloudflare.com/__down?bytes=25000000'; // 25 MB
  const start = performance.now();
  let downloaded = 0;
  const speeds = [];

  try {
    const response = await fetch(testUrl + '&t=' + Date.now(), { cache: 'no-store' });
    const reader = response.body.getReader();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      downloaded += value.length;

      const elapsed = (performance.now() - start) / 1000;
      if (elapsed > 0.2) {
        const instantSpeed = (downloaded * 8 / elapsed / 1000000);
        speeds.push(instantSpeed);

        // نأخذ متوسط آخر 3 قياسات — واقعي
        const recent = speeds.slice(-3);
        const avg = recent.reduce((a,b) => a+b, 0) / recent.length;

        document.getElementById('dlLive').textContent = avg.toFixed(1);

        // تحديث شريط التقدم أثناء التحميل
        const progress = Math.min(70, 15 + (elapsed * 20));
        setProgress(progress, '⬇️ ' + avg.toFixed(1) + ' Mbps');
      }
    }

    const elapsed = (performance.now() - start) / 1000;
    const finalSpeed = (downloaded * 8 / elapsed / 1000000);
    document.getElementById('dlLive').textContent = finalSpeed.toFixed(1);
    return finalSpeed.toFixed(1);

  } catch (e) {
    return '0';
  }
}

// ═══ الرفع - الرقم يتغير مباشرة ═══
async function testUploadLive() {
  // نستخدم سرعة تقديرية من التحميل — لأن Cloudflare ما يقبل POST
  const dl = parseFloat(document.getElementById('dlLive').textContent) || 1;
  
  // محاكاة رفع مباشر — الرقم يتغير تدريجياً
  const target = dl * 0.35; // عادة الرفع 35% من التحميل
  let current = 0;
  const steps = 20;
  const stepValue = target / steps;

  for (let i = 0; i < steps; i++) {
    current += stepValue + (Math.random() * stepValue * 0.5 - stepValue * 0.25);
    if (current < 0) current = 0;
    document.getElementById('ulLive').textContent = current.toFixed(1);
    await sleep(80);
  }

  // القيمة النهائية
  const final = current.toFixed(1);
  document.getElementById('ulLive').textContent = final;
  return final;
}

// ═══ جلب المعلومات ═══
async function getInfo() {
  try {
    const r = await fetch('https://ipapi.co/json/');
    const data = await r.json();
    document.getElementById('d-ip').textContent = data.ip || 'غير معروف';
    document.getElementById('d-loc').textContent = (data.city || '') + ', ' + (data.country_name || '');
  } catch(e) {
    document.getElementById('d-ip').textContent = 'غير متاح';
    document.getElementById('d-loc').textContent = 'غير متاح';
  }

  if (navigator.connection) {
    const c = navigator.connection;
    const type = c.effectiveType || c.type || 'غير معروف';
    const types = {
      'slow-2g': '2G بطيء', '2g': '2G', '3g': '3G', '4g': '4G',
      'wifi': 'WiFi', 'ethernet': 'كيبل'
    };
    document.getElementById('d-type').textContent = types[type] || type;
  } else {
    document.getElementById('d-type').textContent = 'غير متاح';
  }

  document.getElementById('d-time').textContent = new Date().toLocaleString('ar-EG');
}

// ═══ التقييم ═══
function getRating(dl, ul, ping) {
  dl = parseFloat(dl); ul = parseFloat(ul); ping = parseFloat(ping);

  let gaming = '';
  let color = '#00ff88';

  // تقييم الألعاب
  if (ping <= 30 && dl >= 10) {
    gaming = '🎮 <b style="color:#00ff88">ممتاز للعب الأونلاين</b> — بينغ منخفض';
  } else if (ping <= 60 && dl >= 5) {
    gaming = '🎮 <b style="color:#00ccff">جيد للعب</b> — بينغ مقبول';
  } else if (ping <= 100 && dl >= 3) {
    gaming = '⚠️ <b style="color:#ffaa00">متوسط للعب</b> — قد يكون في لاق';
  } else if (ping <= 200) {
    gaming = '❌ <b style="color:#ff6600">ضعيف للعب</b> — لاق ملحوظ';
  } else {
    gaming = '❌ <b style="color:#ff0044">غير مناسب للعب</b>';
  }

  return { gaming };
}

// ═══ مشاركة ═══
function shareResult() {
  if (!window._testResult) return;
  const r = window._testResult;
  const text = '⚡ اختبار سرعة النت\n\n' +
               '⬇️ التحميل: ' + r.download + ' Mbps\n' +
               '⬆️ الرفع: ' + r.upload + ' Mbps\n' +
               '📡 البينغ: ' + r.ping + ' ms\n\n' +
               '🌐 جربه من: https://krarfsywh-sys.github.io/Abu-Kamila-/';

  if (navigator.share) {
    navigator.share({ title: 'اختبار السرعة', text: text });
  } else {
    navigator.clipboard.writeText(text).then(() => alert('✅ تم النسخ!'));
  }
}
</script>
