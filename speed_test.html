
<!-- اختبار سرعة مباشر مستمر -->
<section class="section fade-in" id="speed">
  <h2>⚡ سرعة النت مباشر</h2>
  <p style="text-align:center; color:#aaa; margin-bottom:25px;">الرقم يتحرك مباشرة — حسب اتصالك الحقيقي</p>

  <div class="card" style="padding:25px; border-color:#00ff88; box-shadow:0 0 50px rgba(0,255,136,0.2);">

    <!-- الرقم الكبير -->
    <div style="text-align:center; margin-bottom:20px;">
      <div id="liveSpeed" style="font-size:100px; font-weight:bold; color:#00ff88; font-family:'Courier New', monospace; text-shadow:0 0 60px #00ff88; line-height:1; transition:color 0.2s;">0.00</div>
      <div style="color:#fff; font-size:18px; margin-top:5px;">Mbps</div>
      <div id="liveStatus" style="color:#888; font-size:14px; margin-top:12px;">اضغط "ابدأ" للقياس المستمر</div>
    </div>

    <!-- النبض -->
    <div style="text-align:center; margin-bottom:20px;">
      <div id="pulseDot" style="display:inline-block; width:14px; height:14px; background:#333; border-radius:50%; transition:0.3s;"></div>
    </div>

    <!-- شريط مباشر -->
    <div style="height:20px; background:#0a0a0a; border-radius:10px; overflow:hidden; margin-bottom:20px; border:1px solid rgba(0,255,136,0.3);">
      <div id="liveBar" style="height:100%; width:0%; background:linear-gradient(90deg, #ff0044, #ffaa00, #00ff88); border-radius:10px; transition:width 0.15s linear;"></div>
    </div>

    <!-- رسم بياني -->
    <canvas id="liveGraph" style="width:100%; height:100px; background:#000; border-radius:10px; display:block; margin-bottom:20px; border:1px solid rgba(0,255,136,0.2);"></canvas>

    <!-- الإحصائيات -->
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px;">
      <div style="background:rgba(0,255,136,0.08); border:1px solid #00ff88; border-radius:10px; padding:12px; text-align:center;">
        <div style="color:#888; font-size:10px;">🔺 الأعلى</div>
        <div id="peakBox" style="color:#00ff88; font-size:18px; font-weight:bold; font-family:monospace;">0.00</div>
      </div>
      <div style="background:rgba(0,204,255,0.08); border:1px solid #00ccff; border-radius:10px; padding:12px; text-align:center;">
        <div style="color:#888; font-size:10px;">📊 المعدل</div>
        <div id="avgBox" style="color:#00ccff; font-size:18px; font-weight:bold; font-family:monospace;">0.00</div>
      </div>
      <div style="background:rgba(255,170,0,0.08); border:1px solid #ffaa00; border-radius:10px; padding:12px; text-align:center;">
        <div style="color:#888; font-size:10px;">⏱️ الوقت</div>
        <div id="timeBox" style="color:#ffaa00; font-size:18px; font-weight:bold; font-family:monospace;">0s</div>
      </div>
    </div>

    <!-- الأزرار -->
    <button onclick="startLive()" id="startBtn" style="width:100%; padding:20px; background:linear-gradient(135deg,#00ff88,#00cc66); color:#000; border:none; border-radius:12px; font-size:18px; font-weight:bold; cursor:pointer; font-family:inherit;">▶️ ابدأ القياس</button>
    <button onclick="stopLive()" id="stopBtn" style="display:none; width:100%; margin-top:10px; padding:20px; background:linear-gradient(135deg,#ff0044,#cc0033); color:#fff; border:none; border-radius:12px; font-size:18px; font-weight:bold; cursor:pointer; font-family:inherit;">⏹️ إيقاف</button>

  </div>
</section>

<script>
// ═══ اختبار سرعة مباشر مستمر ═══
var isLive = false;
var allSamples = [];
var peakSpeed = 0;
var startTime = null;
var graphPoints = [];

var canvas = document.getElementById('liveGraph');
var ctx = canvas.getContext('2d');

function sizeCanvas() {
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}
setTimeout(sizeCanvas, 300);
window.addEventListener('resize', sizeCanvas);

function drawGraph() {
  if (!ctx) return;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // شبكة
  ctx.strokeStyle = 'rgba(0,255,136,0.08)';
  ctx.lineWidth = 1;
  for (var i = 1; i <= 4; i++) {
    var y = (canvas.height / 4) * i;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  if (graphPoints.length < 2) return;

  var max = Math.max.apply(null, graphPoints);
  if (max < 5) max = 5;

  var step = canvas.width / (graphPoints.length - 1);

  // خط
  ctx.beginPath();
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 12;

  for (var j = 0; j < graphPoints.length; j++) {
    var x = j * step;
    var y = canvas.height - (graphPoints[j] / max) * canvas.height * 0.9;
    if (j === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // تعبئة
  ctx.lineTo(canvas.width, canvas.height);
  ctx.lineTo(0, canvas.height);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,255,136,0.15)';
  ctx.fill();
  ctx.shadowBlur = 0;
}

function setLive(v, color) {
  var el = document.getElementById('liveSpeed');
  el.textContent = v.toFixed(2);
  el.style.color = color;
  el.style.textShadow = '0 0 60px ' + color;
  document.getElementById('liveBar').style.width = Math.min(100, v) + '%';
  document.getElementById('liveBar').style.background = 'linear-gradient(90deg, ' + color + ', ' + color + ')';
}

function colorFor(v) {
  if (v > 50) return '#00ff88';
  if (v > 20) return '#00ccff';
  if (v > 10) return '#ffaa00';
  if (v > 5) return '#ff6600';
  return '#ff0044';
}

async function liveLoop() {
  while (isLive) {
    try {
      var t0 = performance.now();
      var totalBytes = 0;
      var lastTime = t0;
      var lastBytes = 0;
      var recent = [];

      var resp = await fetch('https://speed.cloudflare.com/__down?bytes=20000000&t=' + Date.now(), {
        cache: 'no-store',
        mode: 'cors'
      });

      var reader = resp.body.getReader();

      while (isLive) {
        var chunk = await reader.read();
        if (chunk.done) break;

        totalBytes += chunk.value.length;
        var now = performance.now();

        if (now - lastTime >= 200) {
          var dt = (now - lastTime) / 1000;
          var dB = totalBytes - lastBytes;
          var instant = (dB * 8) / (dt * 1000000);

          recent.push(instant);
          if (recent.length > 5) recent.shift();

          var smooth = recent.reduce(function(a,b){return a+b;}, 0) / recent.length;

          // إحصائيات
          allSamples.push(smooth);
          if (smooth > peakSpeed) peakSpeed = smooth;

          var avg = allSamples.reduce(function(a,b){return a+b;}, 0) / allSamples.length;
          var elapsed = Math.floor((Date.now() - startTime) / 1000);

          // تحديث
          setLive(smooth, colorFor(smooth));
          document.getElementById('peakBox').textContent = peakSpeed.toFixed(2);
          document.getElementById('avgBox').textContent = avg.toFixed(2);
          document.getElementById('timeBox').textContent = elapsed + 's';

          // رسم
          graphPoints.push(smooth);
          if (graphPoints.length > 100) graphPoints.shift();
          drawGraph();

          lastTime = now;
          lastBytes = totalBytes;
        }
      }
    } catch(e) {
      console.log('Live error:', e);
      await new Promise(function(r){setTimeout(r, 500);});
    }
    // استمرار فوري بدون توقف
    await new Promise(function(r){setTimeout(r, 100);});
  }
}

function startLive() {
  if (isLive) return;
  isLive = true;
  allSamples = [];
  peakSpeed = 0;
  graphPoints = [];
  startTime = Date.now();

  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'block';
  document.getElementById('liveStatus').textContent = '🟢 جاري القياس المستمر...';
  document.getElementById('liveStatus').style.color = '#00ff88';

  var dot = document.getElementById('pulseDot');
  dot.style.background = '#00ff88';
  dot.style.boxShadow = '0 0 20px #00ff88';
  dot.style.animation = 'pulse 1s infinite';

  liveLoop();
}

function stopLive() {
  isLive = false;
  document.getElementById('startBtn').style.display = 'block';
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('liveStatus').textContent = '⏹️ متوقف';
  document.getElementById('liveStatus').style.color = '#888';

  var dot = document.getElementById('pulseDot');
  dot.style.background = '#333';
  dot.style.boxShadow = 'none';
  dot.style.animation = 'none';
}

setTimeout(function() {
  sizeCanvas();
  drawGraph();
}, 500);
</script>

<style>
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.5); opacity: 0.5; }
}
</style>
