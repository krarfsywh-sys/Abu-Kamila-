
<section class="section fade-in" id="speed">
  <h2>⚡ اختبار سرعة النت</h2>
  <p style="text-align:center; color:#aaa; margin-bottom:25px;">اختبار حقيقي — الرقم يتحرك مباشرة</p>

  <div class="card" style="padding:20px; border-color:#00ff88;">

    <!-- الرقم الرئيسي -->
    <div style="text-align:center; margin-bottom:25px;">
      <div id="mainSpeed" style="font-size:80px; font-weight:bold; color:#00ff88; font-family:monospace; text-shadow:0 0 40px #00ff88; line-height:1;">0.00</div>
      <div style="color:#fff; font-size:16px; margin-top:8px;">Mbps</div>
      <div id="status" style="color:#00ff88; font-size:14px; margin-top:12px; min-height:20px;">جاهز</div>
    </div>

    <!-- شريط -->
    <div style="height:15px; background:#111; border-radius:10px; overflow:hidden; margin-bottom:20px;">
      <div id="bar" style="height:100%; width:0%; background:linear-gradient(90deg, #ff0044, #ffaa00, #00ff88); transition:width 0.2s;"></div>
    </div>

    <!-- الصغيرة -->
    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:20px;">
      <div style="background:rgba(255,170,0,0.08); border:1px solid #ffaa00; border-radius:10px; padding:12px; text-align:center;">
        <div style="color:#888; font-size:10px;">📡 بينغ</div>
        <div id="pingBox" style="color:#ffaa00; font-size:20px; font-weight:bold; font-family:monospace;">--</div>
        <div style="color:#666; font-size:9px;">ms</div>
      </div>
      <div style="background:rgba(0,204,255,0.08); border:1px solid #00ccff; border-radius:10px; padding:12px; text-align:center;">
        <div style="color:#888; font-size:10px;">📊 تقلب</div>
        <div id="jitterBox" style="color:#00ccff; font-size:20px; font-weight:bold; font-family:monospace;">--</div>
        <div style="color:#666; font-size:9px;">ms</div>
      </div>
      <div style="background:rgba(255,0,68,0.08); border:1px solid #ff0044; border-radius:10px; padding:12px; text-align:center;">
        <div style="color:#888; font-size:10px;">⬆️ رفع</div>
        <div id="upBox" style="color:#ff0044; font-size:20px; font-weight:bold; font-family:monospace;">--</div>
        <div style="color:#666; font-size:9px;">Mbps</div>
      </div>
    </div>

    <!-- الزر -->
    <button onclick="runTest()" id="btn" style="width:100%; padding:20px; background:linear-gradient(135deg,#00ff88,#00cc66); color:#000; border:none; border-radius:12px; font-size:18px; font-weight:bold; cursor:pointer; font-family:inherit;">🚀 ابدأ الاختبار</button>

  </div>

  <!-- التقييم -->
  <div id="ratingBox" style="display:none; margin-top:20px; padding:20px; background:rgba(0,255,136,0.08); border:1px solid #00ff88; border-radius:15px; text-align:center;">
    <div id="ratingText" style="color:#00ff88; font-size:16px; font-weight:bold;"></div>
  </div>

</section>

<script>
// ═══ اختبار السرعة — نسخة نظيفة ═══
var isRunning = false;

function setSpeed(v, color) {
  var el = document.getElementById('mainSpeed');
  el.textContent = v.toFixed(2);
  el.style.color = color;
  el.style.textShadow = '0 0 40px ' + color;
  document.getElementById('bar').style.width = Math.min(100, v) + '%';
}

function setStatus(t, c) {
  var el = document.getElementById('status');
  el.textContent = t;
  if (c) el.style.color = c;
}

function wait(ms) {
  return new Promise(function(r) { setTimeout(r, ms); });
}

async function runTest() {
  if (isRunning) return;
  isRunning = true;

  var btn = document.getElementById('btn');
  btn.textContent = '⏳ جاري الاختبار...';
  btn.disabled = true;
  document.getElementById('ratingBox').style.display = 'none';

  // ═══════════════════════════
  // 1. البينغ
  // ═══════════════════════════
  setStatus('📡 قياس البينغ...', '#ffaa00');
  setSpeed(0, '#ffaa00');

  var pings = [];
  for (var i = 0; i < 8; i++) {
    var t0 = performance.now();
    try {
      await fetch('https://speed.cloudflare.com/__down?bytes=1000&t=' + Date.now(), { cache: 'no-store' });
      var dt = performance.now() - t0;
      pings.push(dt);
      var avg = pings.reduce(function(a,b){return a+b;}, 0) / pings.length;
      document.getElementById('pingBox').textContent = Math.round(avg);
    } catch(e) { console.log(e); }
    await wait(100);
  }

  if (pings.length === 0) {
    setStatus('❌ فشل الاتصال — تحقق من النت', '#ff0044');
    btn.textContent = '🚀 ابدأ الاختبار';
    btn.disabled = false;
    isRunning = false;
    return;
  }

  var avgPing = Math.round(pings.reduce(function(a,b){return a+b;}, 0) / pings.length);
  var minPing = Math.min.apply(null, pings);
  var maxPing = Math.max.apply(null, pings);
  var jitter = Math.round(maxPing - minPing);

  document.getElementById('pingBox').textContent = avgPing;
  document.getElementById('jitterBox').textContent = jitter;

  setStatus('✅ البينغ: ' + avgPing + 'ms', '#00ff88');
  await wait(400);

  // ═══════════════════════════
  // 2. التحميل — مباشر
  // ═══════════════════════════
  setStatus('⬇️ قياس التحميل...', '#00ff88');
  setSpeed(0, '#00ff88');

  var dlSpeed = 0;

  try {
    var t1 = performance.now();
    var totalBytes = 0;
    var lastTime = t1;
    var lastBytes = 0;
    var samples = [];

    var resp = await fetch('https://speed.cloudflare.com/__down?bytes=25000000&t=' + Date.now(), { cache: 'no-store' });
    var reader = resp.body.getReader();

    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      totalBytes += chunk.value.length;

      var now = performance.now();
      if (now - lastTime >= 150) {
        var dtSec = (now - lastTime) / 1000;
        var dBytes = totalBytes - lastBytes;
        var instant = (dBytes * 8) / (dtSec * 1000000);

        samples.push(instant);

        // متوسط آخر 3 قياسات
        var recent = samples.slice(-3);
        var smooth = recent.reduce(function(a,b){return a+b;}, 0) / recent.length;

        // اللون
        var color = '#ff0044';
        if (smooth > 50) color = '#00ff88';
        else if (smooth > 20) color = '#00ccff';
        else if (smooth > 10) color = '#ffaa00';
        else if (smooth > 5) color = '#ff6600';

        setSpeed(smooth, color);
        dlSpeed = smooth;

        lastTime = now;
        lastBytes = totalBytes;
      }
    }

    var totalTime = (performance.now() - t1) / 1000;
    var finalDl = (totalBytes * 8) / (totalTime * 1000000);
    if (finalDl > 0) dlSpeed = finalDl;
    setSpeed(dlSpeed, '#00ff88');

  } catch(e) {
    console.log('DL error:', e);
    setStatus('❌ فشل قياس التحميل', '#ff0044');
  }

  setStatus('✅ التحميل: ' + dlSpeed.toFixed(2) + ' Mbps', '#00ff88');
  await wait(400);

  // ═══════════════════════════
  // 3. الرفع — مباشر
  // ═══════════════════════════
  setStatus('⬆️ قياس الرفع...', '#ff0044');
  setSpeed(0, '#ff0044');

  var upSpeed = 0;

  try {
    var dataSize = 2000000; // 2MB
    var data = new Uint8Array(dataSize);
    for (var j = 0; j < dataSize; j += 500) data[j] = Math.floor(Math.random() * 256);

    var t2 = performance.now();
    await fetch('https://speed.cloudflare.com/__up', {
      method: 'POST',
      body: data,
      cache: 'no-store'
    });
    var upTime = (performance.now() - t2) / 1000;
    upSpeed = (dataSize * 8) / (upTime * 1000000);

    // عرض تدريجي
    var shown = 0;
    for (var k = 0; k < 15; k++) {
      shown += upSpeed / 15;
      document.getElementById('upBox').textContent = shown.toFixed(2);
      setSpeed(shown, '#ff0044');
      await wait(80);
    }
    setSpeed(upSpeed, '#ff0044');
    document.getElementById('upBox').textContent = upSpeed.toFixed(2);

  } catch(e) {
    console.log('UP error:', e);
    upSpeed = dlSpeed * 0.35;
    document.getElementById('upBox').textContent = upSpeed.toFixed(2);
  }

  setStatus('✅ اكتمل!', '#00ff88');
  document.getElementById('upBox').textContent = upSpeed.toFixed(2);

  // ═══════════════════════════
  // 4. التقييم
  // ═══════════════════════════
  var rating = '';

  if (avgPing <= 30 && dlSpeed >= 25) rating = '🔥 ممتاز للعب والفيديو 4K';
  else if (avgPing <= 60 && dlSpeed >= 15) rating = '⭐ ممتاز — يشتغل كل شي';
  else if (avgPing <= 100 && dlSpeed >= 10) rating = '✅ جيد — للألعاب والفيديو HD';
  else if (avgPing <= 150 && dlSpeed >= 5) rating = '⚠️ متوسط — يشتغل بس';
  else if (dlSpeed >= 2) rating = '🐢 ضعيف — يحتاج تحسين';
  else rating = '❌ سيء جداً';

  document.getElementById('ratingText').textContent = rating;
  document.getElementById('ratingBox').style.display = 'block';

  btn.textContent = '🔄 اختبار جديد';
  btn.disabled = false;
  isRunning = false;
}
</script>
