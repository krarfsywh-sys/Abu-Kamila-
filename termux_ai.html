
<!-- مولّد أوامر Termux -->
<section class="section fade-in" id="termux-ai">
  <h2>💻 مولّد أوامر Termux</h2>
  <p style="text-align:center; color:#aaa; margin-bottom:25px;">
    اكتب شنو تريد — الـ AI يعطيك الأمر الجاهز
  </p>

  <div class="card" style="padding:0; overflow:hidden; border-color:#00ff88; box-shadow:0 0 40px rgba(0,255,136,0.15);">

    <!-- الرأس -->
    <div style="padding:15px 20px; background:linear-gradient(135deg, #00ff88, #00cc66); display:flex; align-items:center; gap:10px;">
      <div style="width:44px; height:44px; background:#000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px;">💻</div>
      <div style="flex:1;">
        <div style="color:#000; font-weight:bold; font-size:16px;">Karrar Termux AI</div>
        <div style="color:#000; font-size:12px; opacity:0.75;">🟢 جاهز لمساعدتك</div>
      </div>
      <button onclick="clearTermuxChat()" style="width:36px; height:36px; background:rgba(0,0,0,0.2); border:none; border-radius:50%; color:#000; font-size:16px; cursor:pointer;">🔄</button>
    </div>

    <!-- الرسائل -->
    <div id="termuxMessages" style="height:400px; overflow-y:auto; padding:20px; background:#0a0a0a; display:flex; flex-direction:column; gap:12px;">

      <div style="display:flex; gap:10px; align-items:flex-start;">
        <div style="width:35px; height:35px; background:#00ff88; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;">💻</div>
        <div style="background:#1a1a1a; padding:12px 16px; border-radius:15px; border-top-right-radius:5px; max-width:80%; color:#fff; font-size:14px; line-height:1.7; border:1px solid rgba(0,255,136,0.2);">
          أهلاً! أنا <b style="color:#00ff88">Termux AI</b> 💻<br>
          اكتب شنو تريد تسوي — وراح أعطيك الأمر الجاهز.
        </div>
      </div>

    </div>

    <!-- الإدخال -->
    <div style="padding:12px; background:#111; border-top:1px solid rgba(0,255,136,0.4); display:flex; gap:8px; align-items:center;">
      <input 
        type="text" 
        id="termuxInput" 
        placeholder="مثال: أريد نسخ ملف..."
        onkeypress="if(event.key==='Enter') sendTermuxMessage()"
        autocomplete="off"
        style="flex:1; padding:14px 20px; background:#1a1a1a; color:#fff; border:2px solid rgba(0,255,136,0.3); border-radius:28px; font-size:15px; outline:none; font-family:inherit;"
      >
      <button 
        onclick="sendTermuxMessage()" 
        style="width:50px; height:50px; background:linear-gradient(135deg, #00ff88, #00cc66); color:#000; border:none; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 0 20px rgba(0,255,136,0.5); flex-shrink:0;"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="#000"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- أمثلة سريعة -->
  <div style="text-align:center; margin-top:20px;">
    <p style="color:#aaa; font-size:13px; margin-bottom:10px;">💡 جرب:</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
      <button onclick="quickTermux('كيف أنسخ ملف')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">📋 نسخ ملف</button>
      <button onclick="quickTermux('كيف أضغط مجلد')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">🗜️ ضغط مجلد</button>
      <button onclick="quickTermux('كيف أشوف الملفات')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">📁 عرض ملفات</button>
      <button onclick="quickTermux('كيف أنزل يوتيوب')" class="btn btn-outline" style="padding:8px 15px; font-size:12px;">📥 تحميل يوتيوب</button>
    </div>
  </div>
</section>

<script>
// ═══ مولّد أوامر Termux ═══
const TERMUX_API = 'https://text.pollinations.ai/';

const TERMUX_SYSTEM = encodeURIComponent(
`أنت مساعد متخصص في Termux على أندرويد.

المستخدم يطلب شي، وأنت تعطيه الأمر الجاهز للنسخ.

قواعد مهمة:
1. أعط الأمر في كود بلوك (code block) دائماً
2. اشرح بشكل مختصر (سطر أو سطرين)
3. اذكر المتطلبات (pkg install...) إذا لازم
4. اقترح متغيرات إذا لزم
5. بالعربي

مثال:
المستخدم: "أريد نسخ ملف"
أنت:
الأمر:
\`\`\`
cp /sdcard/source.txt ~/destination.txt
\`\`\`

الشرح: ينسخ الملف من مجلد إلى آخر. بدل المسارات حسب ملفك.`
);

async function sendTermuxMessage() {
  const input = document.getElementById('termuxInput');
  const message = input.value.trim();
  if (!message) return;

  addTermuxMessage(message, 'user');
  input.value = '';

  const loadingId = addTermuxLoading();

  try {
    const url = TERMUX_API + encodeURIComponent(message) + '?model=openai&system=' + TERMUX_SYSTEM;
    const response = await fetch(url);
    const reply = await response.text();
    removeTermuxLoading(loadingId);
    addTermuxMessage(reply.trim(), 'ai');
  } catch (err) {
    removeTermuxLoading(loadingId);
    addTermuxMessage('❌ صار خطأ — جرب مرة ثانية', 'ai');
  }
}

function addTermuxMessage(text, type) {
  const container = document.getElementById('termuxMessages');
  const div = document.createElement('div');
  div.style.display = 'flex';
  div.style.gap = '10px';
  div.style.alignItems = 'flex-start';
  div.style.animation = 'slideIn 0.3s ease';

  // معالجة الكود
  let formattedText = escapeTermuxHtml(text);
  // تحويل ```code``` إلى كود منسق
  formattedText = formattedText.replace(/```([\s\S]*?)```/g, (match, code) => {
    return `<div style="background:#000; padding:12px; border-radius:8px; margin:8px 0; border:1px solid #00ff88; position:relative;">
      <code style="color:#00ff88; font-family:monospace; font-size:13px; display:block; white-space:pre-wrap; word-break:break-all;">${code.trim()}</code>
      <button onclick="copyCode(this)" style="position:absolute; top:5px; left:5px; padding:3px 8px; background:#00ff88; color:#000; border:none; border-radius:5px; font-size:11px; cursor:pointer; font-weight:bold;">📋 نسخ</button>
    </div>`;
  });
  formattedText = formattedText.replace(/\n/g, '<br>');

  if (type === 'user') {
    div.style.flexDirection = 'row-reverse';
    div.innerHTML = `
      <div style="width:35px; height:35px; background:linear-gradient(135deg, #00ccff, #0099cc); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;">👤</div>
      <div style="background:linear-gradient(135deg, #003d2b, #002a1e); padding:12px 16px; border-radius:15px; border-top-left-radius:5px; max-width:80%; color:#fff; font-size:14px; line-height:1.6; word-wrap:break-word; border:1px solid rgba(0,204,255,0.3);">${escapeTermuxHtml(text)}</div>
    `;
  } else {
    div.innerHTML = `
      <div style="width:35px; height:35px; background:#00ff88; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;">💻</div>
      <div style="background:#1a1a1a; padding:12px 16px; border-radius:15px; border-top-right-radius:5px; max-width:85%; color:#fff; font-size:14px; line-height:1.7; word-wrap:break-word; border:1px solid rgba(0,255,136,0.2);">${formattedText}</div>
    `;
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function copyCode(btn) {
  const code = btn.previousElementSibling.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✅ تم';
    setTimeout(() => btn.textContent = '📋 نسخ', 1500);
  });
}

function addTermuxLoading() {
  const container = document.getElementById('termuxMessages');
  const id = 'termuxLoading_' + Date.now();
  const div = document.createElement('div');
  div.id = id;
  div.style.display = 'flex';
  div.style.gap = '10px';
  div.style.alignItems = 'flex-start';
  div.innerHTML = `
    <div style="width:35px; height:35px; background:#00ff88; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;">💻</div>
    <div style="background:#1a1a1a; padding:14px 18px; border-radius:15px; display:flex; gap:5px; align-items:center;">
      <span style="width:8px; height:8px; background:#00ff88; border-radius:50%; animation:typing 1.4s infinite;"></span>
      <span style="width:8px; height:8px; background:#00ff88; border-radius:50%; animation:typing 1.4s infinite 0.2s;"></span>
      <span style="width:8px; height:8px; background:#00ff88; border-radius:50%; animation:typing 1.4s infinite 0.4s;"></span>
    </div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return id;
}

function removeTermuxLoading(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function quickTermux(text) {
  document.getElementById('termuxInput').value = text;
  sendTermuxMessage();
}

function clearTermuxChat() {
  if (!confirm('محو المحادثة؟')) return;
  const container = document.getElementById('termuxMessages');
  container.innerHTML = `
    <div style="display:flex; gap:10px; align-items:flex-start;">
      <div style="width:35px; height:35px; background:#00ff88; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;">💻</div>
      <div style="background:#1a1a1a; padding:12px 16px; border-radius:15px; border-top-right-radius:5px; max-width:80%; color:#fff; font-size:14px; line-height:1.7;">تم محو المحادثة ✅<br>اسألني أي شي جديد.</div>
    </div>
  `;
}

function escapeTermuxHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
</script>
