
<!-- قسم تيك توك - يفتح التطبيق مباشرة -->
<section class="section fade-in" id="tiktok">
  <h2>🎵 حسابي على تيك توك</h2>
  <p style="text-align:center; color:#aaa; margin-bottom:25px;">
    تابعني — محتوى تقني وتصميم
  </p>
  
  <div style="max-width:400px; margin:0 auto;">
    <div class="card" style="text-align:center; padding:40px 25px; background:linear-gradient(135deg, rgba(0,0,0,0.95), rgba(15,15,15,0.95)); border:2px solid #00ff88; position:relative; overflow:hidden;">
      
      <div style="position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:conic-gradient(from 0deg, transparent, rgba(0,255,136,0.15), transparent); animation:rotate 4s linear infinite;"></div>
      
      <div style="position:relative; z-index:1;">
        
        <div style="font-size:70px; margin-bottom:15px; animation:pulseIcon 2s infinite;">🎵</div>
        
        <h3 style="color:#00ff88; font-size:26px; margin-bottom:8px; text-shadow:0 0 20px #00ff88;">@il2cpp24</h3>
        
        <p style="color:#fff; font-size:15px; margin-bottom:25px;">محتوى تقني • تصميم • برمجة</p>
        
        <!-- الزر الذكي -->
        <button onclick="openTikTok()" style="
          display:inline-block;
          padding:15px 40px;
          background:linear-gradient(135deg, #00ff88, #00cc66);
          color:#000;
          border:none;
          border-radius:50px;
          font-weight:bold;
          font-size:16px;
          box-shadow:0 0 30px rgba(0,255,136,0.6);
          cursor:pointer;
          animation:btnPulse 2s infinite;
          font-family:Arial;
        ">
          🚀 افتح حسابي
        </button>
        
        <p style="color:#888; font-size:12px; margin-top:15px;">يفتح التطبيق مباشرة إن كان مثبت</p>
      </div>
    </div>
  </div>
</section>

<script>
function openTikTok() {
  const username = 'il2cpp24';
  const isAndroid = /Android/i.test(navigator.userAgent);
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  
  // الروابط
  const webUrl = 'https://www.tiktok.com/@' + username;
  const androidDeepLink = 'snssdk1233://user/profile/' + username;
  const iosDeepLink = 'snssdk1233://user/profile/' + username;
  
  if (isAndroid) {
    // جرب التطبيق أولاً
    const intentUrl = 'intent://user/profile/' + username + 
                      '#Intent;scheme=snssdk1233;package=com.zhiliaoapp.musically;S.browser_fallback_url=' + 
                      encodeURIComponent(webUrl) + ';end';
    
    // استخدم location.href للأندرويد
    window.location.href = intentUrl;
    
  } else if (isIOS) {
    // iOS: جرب التطبيق ثم ارجع للمتصفح
    const start = Date.now();
    window.location.href = iosDeepLink;
    
    setTimeout(() => {
      if (Date.now() - start < 2000) {
        window.location.href = webUrl;
      }
    }, 1500);
    
  } else {
    // متصفح عادي
    window.open(webUrl, '_blank');
  }
}
</script>

<style>
@keyframes rotate { to { transform: rotate(360deg); } }
@keyframes pulseIcon { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
@keyframes btnPulse {
  0%, 100% { box-shadow: 0 0 30px rgba(0,255,136,0.6); transform: scale(1); }
  50% { box-shadow: 0 0 50px rgba(0,255,136,0.9); transform: scale(1.05); }
}
</style>
